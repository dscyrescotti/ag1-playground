<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proof Master</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#c9c7bf;--fact:#fff;--factb:#8a8880;--def:#1f6f8b;--fac:#b4532a;--hl:#d99a00;--given:#3d7a3d;--soft:#efeee8}
@media(prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#212326;--ink:#ecebe6;--mute:#a09f99;--line:#4a4c50;--fact:#2a2d31;--factb:#777a80;--def:#58b5d3;--fac:#e58a5e;--hl:#ffd24a;--given:#7fc97f;--soft:#2a2c30}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:230px 1fr 430px;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}
nav a.top{display:block;padding:7px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);margin-bottom:6px;text-align:center}
nav a.top.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 4px 4px}
nav h4{font-size:11px;font-weight:600;color:var(--mute);margin:8px 0 2px 8px}
nav button{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-radius:6px;padding:5px 8px;cursor:pointer}
nav button:hover{background:var(--soft)}nav button.cur{background:var(--soft);font-weight:600}
nav button.blk{font:12px ui-monospace,Menlo,monospace;padding:3px 8px 3px 14px;overflow-wrap:anywhere}
nav details{border:0;padding:0;margin:2px 0}nav summary{padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between}nav summary:hover{background:var(--soft)}
nav summary span{color:var(--mute);font-size:12px}nav details[open] summary{margin-bottom:2px;font-weight:600}
nav i.dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:6px}
#left{position:relative;overflow:hidden;display:flex;flex-direction:column}
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-bottom:1px solid var(--line);background:var(--panel)}
a.tab{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--bg)}
#over.curtab{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
#q{width:230px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-left:auto;flex-wrap:wrap}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#stage{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#index{position:absolute;inset:0;overflow:auto;padding:18px 22px}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{border-radius:5px;padding:3px 9px;font-size:12.5px;cursor:pointer;border:1.4px solid var(--factb);background:var(--fact)}
.chip.given{border-color:var(--given);border-style:dashed}
.chip.Definition{background:var(--def);border-color:var(--def);color:#fff;border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.chip.Fact{background:var(--fac);border-color:var(--fac);color:#fff;border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hide{display:none!important}
#side{background:var(--panel);border-left:1px solid var(--line);padding:16px 18px;overflow:auto}
h1{font-size:18px;margin:0 0 6px}h2{font-size:15.5px;margin:0 0 8px;word-break:break-word}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 5px}
h4{font-size:13px;margin:14px 0 6px}
p{margin:0 0 8px}.mute{color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;color:#fff;margin:0 6px 8px 0}
.say{border-left:3px solid var(--hl);padding:6px 10px;background:var(--soft);border-radius:0 6px 6px 0}
.formal{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:15px;background:var(--soft);border-radius:6px;padding:7px 10px;margin:0 0 8px}
.proof{font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.55}
ul{margin:0;padding-left:18px}li{margin:2px 0}
a.lk{color:inherit;text-decoration:underline dotted;cursor:pointer}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.step{margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.step .hd{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.num{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:var(--hl);color:#000;font-size:12px;font-weight:600}
details{border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin:0 0 8px}summary{cursor:pointer}
details[open] summary{margin-bottom:8px}
.edge{stroke:var(--factb);stroke-width:1.3;fill:none;opacity:.75}
.edge.back{stroke-dasharray:4 4;opacity:.3}
.node.extra rect{stroke-dasharray:2 3}
.edge.on{stroke:var(--hl);stroke-width:2.8;opacity:1}
.node{cursor:pointer}.node rect{stroke-width:1.4}
.fact rect{fill:var(--fact);stroke:var(--factb)}.fact text{fill:var(--ink)}
.fact.given rect{stroke:var(--given);stroke-dasharray:5 3;stroke-width:1.8}
.blk text{fill:#fff;font-family:ui-monospace,Menlo,monospace}
.blk.Definition rect{fill:var(--def);stroke:var(--def)}.blk.Fact rect{fill:var(--fac);stroke:var(--fac)}
.node.root rect{stroke:var(--ink);stroke-width:3}
.node.on rect{stroke:var(--hl);stroke-width:3.2}
svg text{font-size:12px;pointer-events:none;dominant-baseline:central;text-anchor:middle}
.col{font-size:11px!important;fill:var(--mute);letter-spacing:.06em}
@media(max-width:1000px){#app{grid-template-columns:1fr;grid-template-rows:auto 50% 1fr}nav{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}#side{border-left:0;border-top:1px solid var(--line)}.leg{display:none}}

-t-path in G"], "say": "Every walk from s to t contains an s-t-path.", "src": "L2", "formal": "∃ walk from s to t in G ⟹ ∃ s-t-path in G", "proof": "The set of walks from s to t is nonempty and lengths are non-negative integers, so we may choose a walk W = (v₀,…,vₖ) from s to t of minimum length. Suppose vᵢ = vⱼ for some i < j. Then (v₀,…,vᵢ,vⱼ₊₁,…,vₖ) is again a walk from s to t, of length k − (j − i) < k, contradicting the minimality of W. Hence the vertices of W are pairwise distinct, and W is an s-t-path. ∎", "sec": "Walks, paths, distance", "lecs": [1]}, {"name": "distance-pack", "type": "Definition", "needs": ["there is an s-t-path of length k", "no s-t-path has length < k"], "gives": ["d(s,t) = k"], "say": "There is an s-t-path of length k and no shorter one, hence d(s,t) = k.", "src": "L1 slides 13, 17", "formal": "(∃ s-t-path of length k) ∧ (∀ s-t-path P: |P| ≥ k) ⟹ d(s,t) = k", "proof": "d(s,t) := min{ |P| : P is an s-t-path }. The first assumption gives d(s,t) ≤ k, the second gives d(s,t) ≥ k. ∎", "sec": "Walks, paths, distance", "lecs": [1]}, {"name": "distance-unpack", "type": "Definition", "needs": ["d(s,t) = k"], "gives": ["there is an s-t-path of length k", "no s-t-path has length < k"], "say": "Since d(s,t) = k, there is an s-t-path of length k and every s-t-path has length at least k.", "src": "L1 slides 13, 17", "formal": "d(s,t) = k ⟹ (∃ s-t-path of length k) ∧ (∀ s-t-path P: |P| ≥ k)", "proof": "d(s,t) := min{ |P| : P is an s-t-path }. A minimum is attained and is a lower bound. ∎", "sec": "Walks, paths, distance", "lecs": [1]}, {"name": "complete-unpack", "type": "Definition", "needs": ["G = Kₙ"], "gives": ["every two distinct vertices of G are adjacent"], "say": "Since G = Kₙ, every two distinct vertices of G are adjacent.", "src": "L1 slide 28", "formal": "G = Kₙ ⟹ ∀u ≠ v ∈ V(G): {u,v} ∈ E(G)", "proof": "By definition E(Kₙ) = (V choose 2), which contains every two-element subset {u,v} of V. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complete-pack", "type": "Definition", "needs": ["every two distinct vertices of G are adjacent", "G is a graph on n vertices"], "gives": ["G = Kₙ"], "say": "Every two distinct vertices of G are adjacent, hence G = Kₙ.", "src": "L1 slide 28", "formal": "|V(G)| = n ∧ (∀u ≠ v ∈ V(G): {u,v} ∈ E(G)) ⟹ G = Kₙ", "proof": "The assumption gives (V choose 2) ⊆ E(G); always E(G) ⊆ (V choose 2). Hence E(G) = (V choose 2), which is the definition of Kₙ. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complete-edges", "type": "Fact", "needs": ["G = Kₙ"], "gives": ["|E(G)| = n(n−1)/2"], "say": "Kₙ has n(n−1)/2 edges, one for each pair of vertices.", "src": "L1 slide 28", "formal": "|E(Kₙ)| = n(n − 1)/2", "proof": "E(Kₙ) = (V choose 2). There are n(n − 1) ordered pairs (u,v) with u ≠ v, and every two-element subset {u,v} corresponds to exactly two of them, (u,v) and (v,u). Hence |(V choose 2)| = n(n − 1)/2. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complete-regular", "type": "Fact", "needs": ["G = Kₙ"], "gives": ["G is (n−1)-regular"], "say": "In Kₙ every vertex is adjacent to all n − 1 others, so Kₙ is (n−1)-regular.", "src": "L1 slide 28", "formal": "G = Kₙ ⟹ ∀v ∈ V(G): deg(v) = n − 1", "proof": "By complete-unpack, N(v) = V ∖ {v} for every v, so deg(v) = |N(v)| = n − 1. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complete-bipartite-unpack", "type": "Definition", "needs": ["G = K_{a,b} with parts A, B"], "gives": ["V(G) = A ∪ B and A ∩ B = ∅", "u, v adjacent ⟺ u, v lie in different parts"], "say": "Since G = K_{a,b}, its vertex set splits into disjoint parts A, B, and two vertices are adjacent if and only if they lie in different parts.", "src": "L1 slide 29", "formal": "G = K_{a,b} ⟹ V = A ∪ B, A ∩ B = ∅, and ∀u ≠ v: ({u,v} ∈ E ⟺ u, v lie in different parts)", "proof": "By definition E = {{x,y} | x ∈ A, y ∈ B} with A ∩ B = ∅. So {u,v} ∈ E if and only if one of u, v lies in A and the other in B. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complete-bipartite-edges", "type": "Fact", "needs": ["G = K_{a,b} with parts A, B"], "gives": ["|E(G)| = a·b"], "say": "Each of the a vertices of A is adjacent to each of the b vertices of B, so |E| = a·b.", "src": "L1 slide 29", "formal": "|E(K_{a,b})| = a·b", "proof": "The map (x,y) ↦ {x,y} from A × B to E is onto by the definition of E, and one-to-one because A ∩ B = ∅ (from {x,y} we recover x as the element in A). Hence |E| = |A × B| = a·b. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complete-bipartite-is-bipartite", "type": "Fact", "needs": ["G = K_{a,b} with parts A, B"], "gives": ["G is bipartite with parts A, B"], "say": "K_{a,b} is bipartite with parts A and B, since every edge joins A with B.", "src": "L1 slide 29", "formal": "G = K_{a,b} with parts A, B ⟹ G is bipartite with parts A, B", "proof": "V = A ∪ B and A ∩ B = ∅ by definition, and every edge has the form {x,y} with x ∈ A, y ∈ B. By bipartite-pack, G is bipartite. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "bipartite-unpack", "type": "Definition", "needs": ["G is bipartite with parts A, B"], "gives": ["V(G) = A ∪ B and A ∩ B = ∅", "every edge of G has one endpoint in A and one in B"], "say": "Since G is bipartite with parts A, B, every edge of G has one endpoint in A and the other in B.", "src": "L1 slide 39 / T1 Ex 11", "formal": "G bipartite with parts A, B ⟹ V = A ∪ B, A ∩ B = ∅, ∀e ∈ E: |e ∩ A| = |e ∩ B| = 1", "proof": "This is the definition, read in this direction.", "sec": "Special graphs", "lecs": [1]}, {"name": "bipartite-pack", "type": "Definition", "needs": ["V(G) = A ∪ B and A ∩ B = ∅", "every edge of G has one endpoint in A and one in B"], "gives": ["G is bipartite with parts A, B"], "say": "V(G) is split into disjoint sets A, B and every edge joins A with B, hence G is bipartite.", "src": "L1 slide 39 / T1 Ex 11", "formal": "V = A ∪ B, A ∩ B = ∅, ∀e ∈ E: |e ∩ A| = |e ∩ B| = 1 ⟹ G is bipartite with parts A, B", "proof": "This is the definition, read in this direction.", "sec": "Special graphs", "lecs": [1]}, {"name": "bipartite-parity", "type": "Fact", "needs": ["G is bipartite with parts A, B"], "gives": ["even walk ends in its starting part; odd walk ends in the other part"], "say": "Every edge joins A with B, so each step of a walk changes the part; a walk of even length ends in the part where it starts, a walk of odd length in the other part.", "src": "Prereq 1 Ex 4", "formal": "G bipartite with parts A, B; (v₀,…,vₖ) a walk with v₀ ∈ A ⟹ (vₖ ∈ A ⟺ k is even)", "proof": "We prove by induction on i that vᵢ ∈ A if i is even and vᵢ ∈ B if i is odd. Base: v₀ ∈ A. Step: {vᵢ₋₁,vᵢ} ∈ E has exactly one endpoint in A and one in B (bipartite-unpack), so vᵢ lies in the part not containing vᵢ₋₁; the claim for i follows from the claim for i − 1. For i = k we get the statement. The case v₀ ∈ B is symmetric. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "odd-cycle-not-bipartite", "type": "Fact", "needs": ["G contains a cycle of odd length"], "gives": ["G is not bipartite"], "say": "A graph containing an odd cycle is not bipartite.", "src": "T1 Ex 11", "formal": "G contains a cycle of odd length ⟹ G is not bipartite", "proof": "For the sake of contradiction, suppose G is bipartite with parts A, B and contains a cycle with vertices v₀,v₁,…,vₖ₋₁ in this order, k odd. W.l.o.g. v₀ ∈ A. Then (v₀,v₁,…,vₖ₋₁,v₀) is a walk of odd length k starting in A, so by bipartite-parity it ends in B. But it ends in v₀ ∈ A, and A ∩ B = ∅ — a contradiction. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "path-graph-unpack", "type": "Definition", "needs": ["G = Pₙ"], "gives": ["G has n vertices and n − 1 edges"], "say": "Pₙ has n vertices 1,…,n and the n − 1 edges {i,i+1}.", "src": "L1 slide 30", "formal": "G = Pₙ ⟹ |V(G)| = n, |E(G)| = n − 1", "proof": "V = {1,…,n} and E = {{i,i+1} | i = 1,…,n − 1}; these n − 1 sets are pairwise different. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "cycle-graph-unpack", "type": "Definition", "needs": ["G = Cₙ"], "gives": ["n ≥ 3 and G has n vertices and n edges", "G is 2-regular"], "say": "Cₙ (n ≥ 3) has n vertices and n edges, and every vertex has degree 2.", "src": "L1 slide 31", "formal": "G = Cₙ ⟹ n ≥ 3, |V(G)| = |E(G)| = n, ∀v: deg(v) = 2", "proof": "V = {1,…,n}, E = {{i,i+1} | i = 1,…,n − 1} ∪ {{1,n}}. Since n ≥ 3, {1,n} is not of the form {i,i+1}, so |E| = (n − 1) + 1 = n. N(1) = {2,n}, N(n) = {n − 1,1}, and N(i) = {i − 1,i + 1} for 1 < i < n; each has two elements because n ≥ 3. ∎", "sec": "Special graphs", "lecs": [1]}, {"name": "complement-unpack", "type": "Definition", "needs": ["Ḡ is the complement of G"], "gives": ["V(Ḡ) = V(G)", "for u ≠ v: {u,v} ∈ E(Ḡ) ⟺ {u,v} ∉ E(G)"], "say": "By the definition of the complement, Ḡ has the same vertex set as G, and two distinct vertices are adjacent in Ḡ if and only if they are not adjacent in G.", "src": "L1 slide 32", "formal": "Ḡ complement of G ⟹ V(Ḡ) = V(G) ∧ ∀u ≠ v: ({u,v} ∈ E(Ḡ) ⟺ {u,v} ∉ E(G))", "proof": "By definition Ḡ = (V, (V choose 2) ∖ E). For u ≠ v, {u,v} ∈ (V choose 2), so {u,v} ∈ E(Ḡ) ⟺ {u,v} ∉ E. ∎", "sec": "Complement", "lecs": [1]}, {"name": "complement-degree", "type": "Fact", "needs": ["Ḡ is the complement of G", "G is a graph on n vertices"], "gives": ["deg_Ḡ(v) = n − 1 − deg_G(v) for every v"], "say": "Each of the n − 1 other vertices is adjacent to v in exactly one of G and Ḡ, so deg_Ḡ(v) = n − 1 − deg_G(v).", "src": "L1 slide 32", "formal": "∀v ∈ V: deg_Ḡ(v) = n − 1 − deg_G(v)", "proof": "Let v ∈ V. By complement-unpack, every w ∈ V ∖ {v} satisfies exactly one of {v,w} ∈ E(G), {v,w} ∈ E(Ḡ). Hence N_G(v) and N_Ḡ(v) are disjoint and N_G(v) ∪ N_Ḡ(v) = V ∖ {v}. Therefore deg_G(v) + deg_Ḡ(v) = |V ∖ {v}| = n − 1. ∎", "sec": "Complement", "lecs": [1]}, {"name": "degree-neighborhood", "type": "Definition", "needs": ["deg(v) = k"], "gives": ["|N(v)| = k"], "say": "deg(v) = |N(v)|, so v has exactly k neighbors.", "src": "L1 slide 33", "formal": "deg(v) = k ⟹ |N(v)| = k", "proof": "deg(v) := |{e ∈ E | v ∈ e}| and N(v) := {w ∈ V | {v,w} ∈ E}. The map w ↦ {v,w} is a bijection from N(v) onto the set of edges incident with v. Hence deg(v) = |N(v)|. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "degree-pack", "type": "Definition", "needs": ["|N(v)| = k"], "gives": ["deg(v) = k"], "say": "v has exactly k neighbors, so deg(v) = k.", "src": "L1 slide 33", "formal": "|N(v)| = k ⟹ deg(v) = k", "proof": "The map w ↦ {v,w} is a bijection from N(v) onto the set of edges incident with v, so deg(v) = |N(v)| = k. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "neighborhood-unpack", "type": "Definition", "needs": ["v ∈ N(u)"], "gives": ["u and v are adjacent in G"], "say": "Since v ∈ N(u), the vertices u and v are adjacent (and u ≠ v).", "src": "L1 slide 33", "formal": "v ∈ N(u) ⟹ u, v adjacent in G", "proof": "N(u) := {v ∈ V | {u,v} ∈ E}. This is the definition, read in this direction.", "sec": "Degrees", "lecs": [1]}, {"name": "neighborhood-pack", "type": "Definition", "needs": ["u and v are adjacent in G"], "gives": ["v ∈ N(u)"], "say": "u and v are adjacent, hence v ∈ N(u) (and u ∈ N(v)).", "src": "L1 slide 33", "formal": "u, v adjacent in G ⟹ v ∈ N(u)", "proof": "N(u) := {v ∈ V | {u,v} ∈ E}. This is the definition, read in this direction.", "sec": "Degrees", "lecs": [1]}, {"name": "degree-bounds", "type": "Fact", "needs": ["G is a graph on n vertices"], "gives": ["0 ≤ deg(v) ≤ n − 1 for every vertex v"], "say": "A vertex can be adjacent only to the n − 1 other vertices, so 0 ≤ deg(v) ≤ n − 1.", "src": "T1 Ex 1d", "formal": "∀v ∈ V(G): 0 ≤ deg(v) ≤ n − 1", "proof": "Let v ∈ V. If w ∈ N(v) then {v,w} is an edge, a two-element set, so w ≠ v. Hence N(v) ⊆ V ∖ {v} and 0 ≤ deg(v) = |N(v)| ≤ |V ∖ {v}| = n − 1. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "universal-vertex", "type": "Fact", "needs": ["deg(u) = n − 1", "G is a graph on n vertices"], "gives": ["u is adjacent to every other vertex of G"], "say": "Since deg(u) = n − 1, the vertex u is adjacent to all other vertices of G.", "src": "T1 Ex 1f, 2c", "formal": "deg(u) = n − 1 ⟹ N(u) = V ∖ {u}", "proof": "N(u) ⊆ V ∖ {u} (see degree-bounds), and both sets are finite with |N(u)| = n − 1 = |V ∖ {u}|. A subset of a finite set with the same number of elements is the whole set. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "isolated-unpack", "type": "Definition", "needs": ["deg(w) = 0"], "gives": ["w is isolated (adjacent to no vertex)"], "say": "Since deg(w) = 0, the vertex w is isolated: it is adjacent to no vertex.", "src": "L1 slide 34", "formal": "deg(w) = 0 ⟹ N(w) = ∅", "proof": "|N(w)| = deg(w) = 0, so N(w) = ∅; such a vertex is called isolated. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "isolated-pack", "type": "Definition", "needs": ["w is isolated (adjacent to no vertex)"], "gives": ["deg(w) = 0"], "say": "w is adjacent to no vertex, so deg(w) = 0.", "src": "L1 slide 34", "formal": "N(w) = ∅ ⟹ deg(w) = 0", "proof": "deg(w) = |N(w)| = |∅| = 0. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "universal-excludes-isolated", "type": "Fact", "needs": ["u is adjacent to every other vertex of G", "n ≥ 2"], "gives": ["deg(v) ≥ 1 for every vertex v (no isolated vertex)"], "say": "u is adjacent to every other vertex, so every vertex other than u has u as a neighbor, and u itself has n − 1 ≥ 1 neighbors. Hence every vertex of G has degree at least 1; in particular G has no isolated vertex.", "src": "T1 Ex 2c", "formal": "n ≥ 2 ∧ N(u) = V ∖ {u} ⟹ ∀v ∈ V: deg(v) ≥ 1", "proof": "Let v ∈ V. If v ≠ u, then v ∈ V ∖ {u} = N(u), so {u,v} ∈ E and u ∈ N(v); hence deg(v) ≥ 1. If v = u, then deg(u) = |V ∖ {u}| = n − 1 ≥ 1, because n ≥ 2. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "same-degree", "type": "Fact", "needs": ["G is a graph on n vertices", "n ≥ 2"], "gives": ["two vertices of G have the same degree"], "say": "The degrees lie in {0,…,n−1}, and 0 and n − 1 cannot both occur, so the n vertices use at most n − 1 values; by the pigeonhole principle two vertices have the same degree.", "src": "T1 Ex 2a, 3", "formal": "n ≥ 2 ⟹ ∃u ≠ v ∈ V(G): deg(u) = deg(v)", "proof": "For the sake of contradiction, suppose all degrees are distinct. By degree-bounds, deg is a one-to-one map from V into {0,1,…,n − 1}. Both sets have n elements, so deg is onto: there are w, u ∈ V with deg(w) = 0 and deg(u) = n − 1. By universal-vertex, N(u) = V ∖ {u}; by universal-excludes-isolated, every vertex has degree at least 1. This contradicts deg(w) = 0. ∎", "sec": "Degrees", "lecs": [1]}, {"name": "regular-unpack", "type": "Definition", "needs": ["G is r-regular"], "gives": ["deg(v) = r for every vertex v"], "say": "Since G is r-regular, deg(v) = r for every vertex v.", "src": "L1 slide 34", "formal": "G is r-regular ⟹ ∀v ∈ V: deg(v) = r", "proof": "This is the definition, read in this direction.", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "regular-pack", "type": "Definition", "needs": ["deg(v) = r for every vertex v"], "gives": ["G is r-regular"], "say": "Every vertex of G has degree r, hence G is r-regular.", "src": "L1 slide 34", "formal": "∀v ∈ V: deg(v) = r ⟹ G is r-regular", "proof": "This is the definition, read in this direction.", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "degree-sum", "type": "Fact", "needs": ["G is a graph on n vertices"], "gives": ["Σ deg(v) = 2·|E(G)|"], "say": "By the Degree Sum Formula, Σ deg(v) = 2|E|.", "src": "L1 slide 35, L2 slide 6", "formal": "Σ_{v∈V} deg(v) = 2·|E|", "proof": "Let I = {(v,e) | v ∈ V, e ∈ E, v ∈ e}. Counting by vertices: each v lies in exactly deg(v) edges, so |I| = Σ_{v∈V} deg(v). Counting by edges: each edge has exactly two elements, so |I| = Σ_{e∈E} 2 = 2|E|. Comparing the two counts gives the formula. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1, 2]}, {"name": "degree-sum-even", "type": "Fact", "needs": ["Σ deg(v) = 2·|E(G)|"], "gives": ["Σ deg(v) is even"], "say": "Hence the sum of all degrees is even.", "src": "L1 slide 36", "formal": "Σ deg(v) = 2|E| ⟹ Σ deg(v) ≡ 0 (mod 2)", "proof": "|E| is an integer, so 2|E| is divisible by 2. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "handshaking", "type": "Fact", "needs": ["Σ deg(v) is even"], "gives": ["the number of odd-degree vertices of G is even"], "say": "The degree sum is even, so the number of odd-degree vertices is even (Handshaking Lemma).", "src": "L1 slide 36", "formal": "Σ deg(v) even ⟹ |{v ∈ V : deg(v) is odd}| is even", "proof": "Let O = {v ∈ V | deg(v) is odd}. Then Σ_{v∈V} deg(v) = Σ_{v∈O} deg(v) + Σ_{v∉O} deg(v). The left side is even and the last sum is a sum of even numbers, so S = Σ_{v∈O} deg(v) is even. S is a sum of |O| odd numbers, hence S ≡ |O| (mod 2). Therefore |O| is even. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "regular-degree-sum", "type": "Fact", "needs": ["deg(v) = r for every vertex v", "Σ deg(v) = 2·|E(G)|"], "gives": ["n·r = 2·|E(G)|"], "say": "All n vertices have degree r, so by the Degree Sum Formula n·r = 2|E|.", "src": "L1 slide 36", "formal": "(∀v: deg(v) = r) ∧ Σ deg(v) = 2|E| ⟹ n·r = 2|E|", "proof": "Σ_{v∈V} deg(v) = Σ_{v∈V} r = n·r. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "regular-odd-degree", "type": "Fact", "needs": ["n·r = 2·|E(G)|", "r is odd"], "gives": ["n is even"], "say": "n·r is even and r is odd, hence n is even.", "src": "L1 slide 36", "formal": "n·r = 2|E| ∧ r odd ⟹ n even", "proof": "n·r = 2|E| is even. If n were odd, n·r would be a product of two odd numbers, hence odd — a contradiction. So n is even. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "zero-regular-shape", "type": "Fact", "needs": ["G is 0-regular"], "gives": ["G consists of n isolated vertices"], "say": "A 0-regular graph has no edges: it consists of n isolated vertices.", "src": "L1 slide 34", "formal": "G 0-regular ⟹ E(G) = ∅", "proof": "Every vertex has deg(v) = 0, so N(v) = ∅ for all v. An edge {u,v} would give v ∈ N(u). Hence E = ∅. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "one-regular-shape", "type": "Fact", "needs": ["G is 1-regular"], "gives": ["G is a disjoint union of edges", "n is even"], "say": "In a 1-regular graph every vertex lies in exactly one edge, so G is a disjoint union of edges and n is even.", "src": "L1 slide 34", "formal": "G 1-regular ⟹ E(G) is a set of pairwise disjoint edges covering V, and n is even", "proof": "Every vertex v has exactly one neighbor; call it m(v). Since v ∈ N(m(v)) and |N(m(v))| = 1, we get m(m(v)) = v. So the sets {v, m(v)} partition V into pairs, each pair is an edge, and there are no other edges, because an edge {v,w} forces w = m(v). The pairs are disjoint, so n = 2·(number of pairs) is even. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "two-regular-shape", "type": "Fact", "needs": ["G is 2-regular"], "gives": ["G is a disjoint union of cycles"], "say": "A 2-regular graph is a disjoint union of cycles.", "src": "L1 slide 34", "formal": "G 2-regular ⟹ G is a disjoint union of cycles", "proof": "(Sketch.) Start at any vertex v₀ and walk v₀,v₁,v₂,…, always leaving a vertex by the edge not used to enter it (possible since every degree is 2). V is finite, so some vertex repeats; the first repeated vertex is v₀, since any other first repeat would have three different neighbors on the walk. This gives a cycle C through v₀. No vertex of C has a neighbor outside C (both its edges lie in C). Remove C; the rest is still 2-regular; repeat. ∎", "sec": "Regular graphs, Degree Sum Formula", "lecs": [1]}, {"name": "count-graphs", "type": "Fact", "needs": ["V is a fixed vertex set with |V| = n"], "gives": ["there are exactly 2^(n(n−1)/2) graphs on V"], "say": "A graph on V is determined by its edge set, a subset of the n(n−1)/2 pairs; hence there are 2^(n(n−1)/2) graphs on V.", "src": "T1 Ex 5, L3 slide 8", "formal": "|V| = n ⟹ |{G : V(G) = V}| = 2^(n(n−1)/2)", "proof": "A graph on V is the pair (V,E) with E ⊆ (V choose 2), so the graphs on V correspond one-to-one to the subsets of (V choose 2). By complete-edges, |(V choose 2)| = n(n − 1)/2, and a set with N elements has exactly 2^N subsets. ∎", "sec": "Counting", "lecs": [1, 3]}, {"name": "count-paths-complete", "type": "Fact", "needs": ["x ≠ y are vertices of Kₙ"], "gives": ["the number of x-y-paths of length k is (n−2)(n−3)···(n−k)"], "say": "An x-y-path of length k has k − 1 inner vertices, distinct and different from x, y; choosing them in order gives (n−2)(n−3)···(n−k) paths, and each choice is a path because all vertices of Kₙ are adjacent.", "src": "T1 Ex 6, Prereq 1 Ex 3", "formal": "x ≠ y ∈ V(Kₙ) ⟹ #{x-y-paths of length k} = (n − 2)(n − 3)···(n − k)", "proof": "An x-y-path of length k is a sequence (x,w₁,…,wₖ₋₁,y) of pairwise distinct vertices; conversely every such sequence is a path, since all distinct vertices of Kₙ are adjacent (complete-unpack). So the paths correspond one-to-one to the ordered (k − 1)-tuples of distinct elements of V ∖ {x,y}, a set of size n − 2. There are (n − 2)(n − 3)···(n − k) such tuples. ∎", "sec": "Counting", "lecs": [1]}, {"name": "subgraph-unpack", "type": "Definition", "needs": ["H is a subgraph of G"], "gives": ["V(H) ⊆ V(G) and E(H) ⊆ E(G)"], "say": "Since H ⊆ G, V(H) ⊆ V(G) and E(H) ⊆ E(G).", "src": "L2 slide 2", "formal": "H ⊆ G ⟹ V(H) ⊆ V(G) ∧ E(H) ⊆ E(G)", "proof": "This is the definition, read in this direction.", "sec": "Subgraphs", "lecs": [1, 2]}, {"name": "subgraph-pack", "type": "Definition", "needs": ["V(H) ⊆ V(G) and E(H) ⊆ E(G)"], "gives": ["H is a subgraph of G"], "say": "V(H) ⊆ V(G) and E(H) ⊆ E(G), hence H is a subgraph of G.", "src": "L2 slide 2", "formal": "V(H) ⊆ V(G) ∧ E(H) ⊆ E(G) ⟹ H ⊆ G", "proof": "This is the definition, read in this direction.", "sec": "Subgraphs", "lecs": [1, 2]}, {"name": "induced-unpack", "type": "Definition", "needs": ["H is an induced subgraph of G"], "gives": ["V(H) ⊆ V(G)", "E(H) contains every edge of G with both endpoints in V(H)"], "say": "Since H is an induced subgraph, every edge of G with both endpoints in V(H) is an edge of H.", "src": "L2 slide 2", "formal": "H induced subgraph of G ⟹ V(H) ⊆ V(G) ∧ E(H) = E(G) ∩ (V(H) choose 2)", "proof": "This is the definition, read in this direction.", "sec": "Subgraphs", "lecs": [1, 2]}, {"name": "induced-pack", "type": "Definition", "needs": ["H is a subgraph of G", "E(H) contains every edge of G with both endpoints in V(H)"], "gives": ["H is an induced subgraph of G"], "say": "H is a subgraph of G and no edge of G between two vertices of H is missing in H, hence H is induced.", "src": "L2 slide 2", "formal": "H ⊆ G ∧ E(G) ∩ (V(H) choose 2) ⊆ E(H) ⟹ H is an induced subgraph of G", "proof": "Since H is a graph, E(H) ⊆ (V(H) choose 2); since H ⊆ G, E(H) ⊆ E(G). So E(H) ⊆ E(G) ∩ (V(H) choose 2). The other inclusion is assumed. Hence equality holds, which is the definition of an induced subgraph. ∎", "sec": "Subgraphs", "lecs": [1, 2]}, {"name": "induced-is-subgraph", "type": "Fact", "needs": ["H is an induced subgraph of G"], "gives": ["H is a subgraph of G"], "say": "Every induced subgraph is a subgraph.", "src": "L2 slide 2", "formal": "H induced subgraph of G ⟹ H ⊆ G", "proof": "V(H) ⊆ V(G) by definition, and E(H) = E(G) ∩ (V(H) choose 2) ⊆ E(G). ∎", "sec": "Subgraphs", "lecs": [1, 2]}, {"name": "induced-by-vertex-set", "type": "Fact", "needs": ["H is an induced subgraph of G"], "gives": ["H = G[V(H)], so H is determined by its vertex set"], "say": "An induced subgraph is determined by its vertex set: H = G[V(H)].", "src": "L2 slide 2", "formal": "H induced subgraph of G ⟹ H = G[V(H)]", "proof": "E(H) = E(G) ∩ (V(H) choose 2) = E(G[V(H)]) and the vertex sets agree. So H depends only on V(H). ∎", "sec": "Subgraphs", "lecs": [1, 2]}, {"name": "shortest-cycle-induced", "type": "Fact", "needs": ["C is a shortest cycle in G"], "gives": ["C is an induced subgraph of G"], "say": "A shortest cycle is induced: an edge of G joining two non-consecutive vertices of C (a chord) would, with one of the two arcs of C, form a shorter cycle.", "src": "T1 Ex 13", "formal": "C a shortest cycle in G ⟹ C is an induced subgraph of G", "proof": "Let C have vertices v₁,…,vₖ in this order. For the sake of contradiction, suppose C is not induced: there is an edge {vᵢ,vⱼ} ∈ E(G) ∖ E(C) with i < j. Then j − i ≥ 2 and (i,j) ≠ (1,k), so 2 ≤ j − i ≤ k − 2. The vertices vᵢ,vᵢ₊₁,…,vⱼ together with the edge {vⱼ,vᵢ} form a cycle of length j − i + 1, where 3 ≤ j − i + 1 ≤ k − 1 < k. This contradicts the choice of C as a shortest cycle. ∎", "sec": "Subgraphs", "lecs": [1]}, {"name": "shortest-odd-cycle-induced", "type": "Fact", "needs": ["C is a shortest odd cycle in G"], "gives": ["C is an induced subgraph of G"], "say": "A shortest odd cycle is induced: a chord splits C (length k) into two shorter cycles whose lengths sum to k + 2, an odd number, so one of them is odd — contradicting minimality.", "src": "T1 Ex 13", "formal": "C a shortest odd cycle in G ⟹ C is an induced subgraph of G", "proof": "Let C have vertices v₁,…,vₖ in this order, k odd. Suppose there is an edge {vᵢ,vⱼ} ∈ E(G) ∖ E(C), i < j; as before 2 ≤ j − i ≤ k − 2. It splits C into two cycles: C₁ on vᵢ,…,vⱼ of length j − i + 1, and C₂ on vⱼ,…,vₖ,v₁,…,vᵢ of length k − (j − i) + 1. Both lengths are between 3 and k − 1, and their sum is k + 2, an odd number. Hence one of C₁, C₂ has odd length and is shorter than C — a contradiction. ∎", "sec": "Subgraphs", "lecs": [1]}, {"name": "digraph-unpack", "type": "Definition", "needs": ["G is a directed graph"], "gives": ["edges are ordered pairs; (u,v) ≠ (v,u); loops (u,u) are allowed"], "say": "In a directed graph the edges are ordered pairs of vertices; loops are allowed.", "src": "L1 slide 37", "formal": "G = (V,E) directed ⟹ E ⊆ V × V", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [1]}, {"name": "successor-unpack", "type": "Definition", "needs": ["(u,v) ∈ E(G)"], "gives": ["u is a predecessor of v and v is a successor of u"], "say": "Since (u,v) ∈ E, u is a predecessor of v and v is a successor of u.", "src": "L1 slide 37", "formal": "(u,v) ∈ E(G) ⟹ u predecessor of v, v successor of u", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [1]}, {"name": "induced-notation", "type": "Definition", "needs": ["V′ ⊆ V(G) and V′ ≠ ∅"], "gives": ["G[V′] has vertex set V′ and edge set E(G) ∩ (V′ choose 2)", "G[V′] is an induced subgraph of G"], "say": "G[V′] denotes the subgraph of G induced by V′: its vertex set is V′ and its edges are all edges of G with both endpoints in V′.", "src": "L2 slide 2", "formal": "∅ ≠ V′ ⊆ V(G) ⟹ G[V′] := (V′, E(G) ∩ (V′ choose 2)) is an induced subgraph of G", "proof": "By definition. G[V′] is a graph because V′ is nonempty and finite, and it satisfies the definition of an induced subgraph with V(H) = V′. ∎", "sec": "Subgraphs", "lecs": [2]}, {"name": "vertex-deletion", "type": "Definition", "needs": ["v ∈ V(G)", "n ≥ 2"], "gives": ["G − v = G[V(G) ∖ {v}]"], "say": "G − v denotes the graph obtained from G by deleting the vertex v together with all edges incident with v.", "src": "L2 slide 2", "formal": "v ∈ V(G), n ≥ 2 ⟹ G − v := G[V(G) ∖ {v}]", "proof": "By definition. Since n ≥ 2, the set V(G) ∖ {v} is nonempty, so G − v is a graph. ∎", "sec": "Subgraphs", "lecs": [2]}, {"name": "delete-vertex-edges", "type": "Fact", "needs": ["G − v = G[V(G) ∖ {v}]"], "gives": ["|E(G − v)| = |E(G)| − deg(v)"], "say": "Deleting v removes exactly the deg(v) edges incident with v.", "src": "L2 slide 2", "formal": "|E(G − v)| = |E(G)| − deg_G(v)", "proof": "E(G − v) = E(G) ∩ (V ∖ {v} choose 2) = E(G) ∖ {e ∈ E(G) | v ∈ e}. The removed set has exactly deg_G(v) elements by the definition of the degree. ∎", "sec": "Subgraphs", "lecs": [2]}, {"name": "subgraph-path", "type": "Fact", "needs": ["H is a subgraph of G", "v₀,…,vₖ is a path of length k in H"], "gives": ["v₀,…,vₖ is a path of length k in G"], "say": "H is a subgraph of G, so every path in H is also a path in G.", "src": "L2 slide 2", "formal": "H ⊆ G ∧ (v₀,…,vₖ) path in H ⟹ (v₀,…,vₖ) path in G", "proof": "The vertices v₀,…,vₖ are pairwise distinct and lie in V(H) ⊆ V(G), and {vᵢ₋₁,vᵢ} ∈ E(H) ⊆ E(G) for all i. ∎", "sec": "Subgraphs", "lecs": [2]}, {"name": "clique-unpack", "type": "Definition", "needs": ["W is a clique in G"], "gives": ["every two distinct vertices of W are adjacent in G"], "say": "Since W is a clique, every two distinct vertices of W are adjacent.", "src": "L2 slide 5", "formal": "W clique in G ⟹ ∀u ≠ v ∈ W: {u,v} ∈ E(G)", "proof": "This is the definition, read in this direction.", "sec": "Subgraphs", "lecs": [2]}, {"name": "clique-pack", "type": "Definition", "needs": ["every two distinct vertices of W are adjacent in G"], "gives": ["W is a clique in G"], "say": "Every two distinct vertices of W are adjacent, hence W is a clique.", "src": "L2 slide 5", "formal": "(∀u ≠ v ∈ W: {u,v} ∈ E(G)) ⟹ W clique in G", "proof": "This is the definition, read in this direction.", "sec": "Subgraphs", "lecs": [2]}, {"name": "clique-induces-complete", "type": "Fact", "needs": ["every two distinct vertices of W are adjacent in G"], "gives": ["G[W] is a complete graph on |W| vertices"], "say": "All pairs of vertices of W are edges of G, so G[W] is a complete graph.", "src": "L2 slide 5", "formal": "(∀u ≠ v ∈ W: {u,v} ∈ E(G)) ⟹ G[W] = (W, (W choose 2))", "proof": "The assumption says (W choose 2) ⊆ E(G). Hence E(G[W]) = E(G) ∩ (W choose 2) = (W choose 2), the edge set of the complete graph on W. ∎", "sec": "Subgraphs", "lecs": [2]}, {"name": "connected-unpack", "type": "Definition", "needs": ["G is connected"], "gives": ["for every two vertices u, v of G there is a u-v-path in G"], "say": "Since G is connected, for every two vertices u, v there is a u-v-path in G.", "src": "L2 slide 12", "formal": "G connected ⟹ ∀u, v ∈ V(G): ∃ u-v-path in G", "proof": "This is the definition, read in this direction.", "sec": "Connectivity", "lecs": [2]}, {"name": "connected-pack", "type": "Definition", "needs": ["for every two vertices u, v of G there is a u-v-path in G"], "gives": ["G is connected"], "say": "Any two vertices of G are joined by a path, hence G is connected.", "src": "L2 slide 12", "formal": "(∀u, v ∈ V(G): ∃ u-v-path in G) ⟹ G connected", "proof": "This is the definition, read in this direction.", "sec": "Connectivity", "lecs": [2]}, {"name": "disconnected-unpack", "type": "Definition", "needs": ["G is disconnected"], "gives": ["there are vertices u, v of G with no u-v-path in G"], "say": "Since G is disconnected, there are vertices u, v with no u-v-path in G.", "src": "L2 slide 12", "formal": "G disconnected ⟹ ∃u, v ∈ V(G): there is no u-v-path in G", "proof": "Disconnected means not connected; negating “∀u, v: ∃ u-v-path” gives “∃u, v: no u-v-path”. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "disconnected-pack", "type": "Definition", "needs": ["there are vertices u, v of G with no u-v-path in G"], "gives": ["G is disconnected"], "say": "The vertices u and v are not joined by any path, hence G is disconnected.", "src": "L2 slide 12", "formal": "(∃u, v ∈ V(G): there is no u-v-path in G) ⟹ G disconnected", "proof": "The pair u, v violates the definition of a connected graph. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "path-relation-equivalence", "type": "Fact", "needs": ["G is a graph on n vertices"], "gives": ["u ↭ v ⟺ (∃ u-v-path in G) is an equivalence relation on V(G)"], "say": "The relation “there is a u-v-path” is an equivalence relation on V(G).", "src": "L2 slide 14", "formal": "↭ is reflexive, symmetric and transitive on V(G)", "proof": "Reflexive: (u) is a u-u-path of length 0. Symmetric: if (v₀,…,vₖ) is a u-v-path, then (vₖ,…,v₀) is a v-u-path, because edges are unordered pairs. Transitive: if (u = a₀,…,aₖ = v) and (v = b₀,…,b_ℓ = w) are paths, then (a₀,…,aₖ,b₁,…,b_ℓ) is a walk from u to w, and by walk-to-path there is a u-w-path. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "component-unpack", "type": "Definition", "needs": ["H is a connected component of G"], "gives": ["H is an induced subgraph of G", "H is connected", "no connected subgraph F ≠ H of G contains H"], "say": "Since H is a connected component, H is an induced subgraph of G, H is connected, and no larger connected subgraph of G contains H.", "src": "L2 slide 13", "formal": "H component of G ⟹ H induced subgraph ∧ H connected ∧ ¬∃F ⊆ G connected: H ⊆ F, F ≠ H", "proof": "This is the definition, read in this direction.", "sec": "Connectivity", "lecs": [2]}, {"name": "component-pack", "type": "Definition", "needs": ["H is an induced subgraph of G", "H is connected", "no connected subgraph F ≠ H of G contains H"], "gives": ["H is a connected component of G"], "say": "H is an induced connected subgraph of G that is not contained in any larger connected subgraph, hence H is a connected component of G.", "src": "L2 slide 13", "formal": "H induced subgraph ∧ H connected ∧ ¬∃F ⊆ G connected: H ⊆ F, F ≠ H ⟹ H component of G", "proof": "This is the definition, read in this direction.", "sec": "Connectivity", "lecs": [2]}, {"name": "component-classes", "type": "Fact", "needs": ["u ↭ v ⟺ (∃ u-v-path in G) is an equivalence relation on V(G)"], "gives": ["the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "say": "The connected components of G are exactly the subgraphs induced by the equivalence classes of ↭.", "src": "L2 slide 14", "formal": "{V(H) | H component of G} = V(G)/↭", "proof": "(⊇) Let C be an equivalence class. (1) G[C] is connected: for u, v ∈ C there is a u-v-path P in G; every vertex x of P satisfies u ↭ x (use the initial part of P), so x ∈ C, and P is a path in G[C]. (2) G[C] is maximal: let F ⊆ G be connected with G[C] ⊆ F. For x ∈ V(F) and u ∈ C there is a u-x-path in F, hence in G, so x ∈ C. Thus V(F) = C and E(F) ⊆ E(G) ∩ (C choose 2) = E(G[C]), i.e. F = G[C]. So G[C] is a component. (⊆) Let H be a component, u ∈ V(H), and C the class of u. H is connected, so every x ∈ V(H) has a u-x-path in H ⊆ G; hence V(H) ⊆ C. As H is induced, H = G[V(H)] ⊆ G[C]. G[C] is connected by (1), so by the maximality of H, H = G[C] and V(H) = C. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "components-partition", "type": "Fact", "needs": ["the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "gives": ["every vertex of G lies in exactly one connected component of G"], "say": "The components correspond to the classes of an equivalence relation, so every vertex lies in exactly one connected component.", "src": "L2 slide 14", "formal": "∀v ∈ V(G): ∃! component H of G with v ∈ V(H)", "proof": "The equivalence classes of an equivalence relation on V(G) partition V(G): every vertex lies in exactly one class. By component-classes the classes are the vertex sets of the components. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "no-edge-between-components", "type": "Fact", "needs": ["the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "gives": ["no edge of G joins two different connected components of G"], "say": "An edge {u,v} is a u-v-path, so its endpoints lie in the same connected component: no edge joins two different components.", "src": "L2 slide 14", "formal": "{u,v} ∈ E(G) ⟹ u, v lie in the same component of G", "proof": "If {u,v} ∈ E(G), then (u,v) is a u-v-path, so u ↭ v, and u, v lie in the same equivalence class. By component-classes this class is the vertex set of one component. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "connected-one-component", "type": "Fact", "needs": ["G is connected", "the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "gives": ["G has exactly one connected component"], "say": "G is connected, so all vertices are in one class of ↭ and G has exactly one connected component.", "src": "L2 slide 14 (Observation)", "formal": "G connected ⟹ G has exactly one component", "proof": "By connected-unpack, u ↭ v for all u, v ∈ V(G), so ↭ has the single class V(G) (V(G) ≠ ∅). By component-classes, G has exactly one component, namely G[V(G)] = G. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "one-component-connected", "type": "Fact", "needs": ["G has exactly one connected component", "the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "gives": ["G is connected"], "say": "G has exactly one connected component, so any two vertices lie in it and are joined by a path: G is connected.", "src": "L2 slide 14 (Observation)", "formal": "G has exactly one component ⟹ G connected", "proof": "By component-classes, ↭ has exactly one class, which must be V(G). Hence u ↭ v, i.e. there is a u-v-path, for all u, v ∈ V(G). By connected-pack, G is connected. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "disconnected-two-components", "type": "Fact", "needs": ["there are vertices u, v of G with no u-v-path in G", "the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "gives": ["G has at least two connected components"], "say": "u and v are not joined by a path, so they lie in different connected components: G has at least two components.", "src": "L2 slide 14", "formal": "(∃u, v: no u-v-path) ⟹ G has ≥ 2 components", "proof": "u and v are not related by ↭, so they lie in different equivalence classes. By component-classes these are the vertex sets of two different components. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "two-components-disconnected", "type": "Fact", "needs": ["G has at least two connected components", "the vertex sets of the connected components of G are exactly the equivalence classes of ↭"], "gives": ["there are vertices u, v of G with no u-v-path in G"], "say": "Take u and v in two different components; they lie in different classes of ↭, so there is no u-v-path.", "src": "L2 slide 14", "formal": "G has ≥ 2 components ⟹ ∃u, v: no u-v-path in G", "proof": "Choose u and v in two different components. By component-classes they lie in different classes of ↭, i.e. u ↭ v does not hold: there is no u-v-path. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "connected-min-degree", "type": "Fact", "needs": ["G is connected", "n ≥ 2"], "gives": ["deg(v) ≥ 1 for every vertex v (no isolated vertex)"], "say": "G is connected and has at least two vertices, so every vertex has a neighbor: every degree is at least 1.", "src": "T2 Ex 15", "formal": "G connected ∧ n ≥ 2 ⟹ ∀v ∈ V(G): deg(v) ≥ 1", "proof": "Let v ∈ V(G). Since n ≥ 2 there is a vertex u ≠ v, and by connected-unpack a v-u-path (v = v₀,v₁,…,vₖ = u). As u ≠ v we have k ≥ 1, so v₁ ∈ N(v) and deg(v) ≥ 1. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "disconnected-complement-connected", "type": "Fact", "needs": ["G has at least two connected components", "no edge of G joins two different connected components of G", "Ḡ is the complement of G"], "gives": ["Ḡ is connected"], "say": "The complement of a disconnected graph is connected.", "src": "T2 Ex 14", "formal": "G disconnected ⟹ Ḡ connected", "proof": "Let u ≠ v be vertices of Ḡ (for u = v the path of length 0 works). Case 1: u, v lie in different components of G. By no-edge-between-components {u,v} ∉ E(G), so by complement-unpack {u,v} ∈ E(Ḡ) and (u,v) is a u-v-path in Ḡ. Case 2: u, v lie in the same component of G. G has at least two components, so there is a vertex w in another component. Then {u,w}, {v,w} ∉ E(G), hence {u,w}, {w,v} ∈ E(Ḡ), and (u,w,v) is a u-v-path in Ḡ. In both cases there is a u-v-path in Ḡ; by connected-pack Ḡ is connected. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "regular-half-connected", "type": "Fact", "needs": ["G is n-regular and has 2n vertices"], "gives": ["G is connected"], "say": "Two non-adjacent vertices have n neighbors each among the remaining 2n − 2 vertices, so they have a common neighbor; hence any two vertices are joined by a path of length at most 2.", "src": "T2 Ex 17", "formal": "G n-regular, |V(G)| = 2n ⟹ G connected", "proof": "Let u ≠ v ∈ V(G). If {u,v} ∈ E(G), then (u,v) is a u-v-path. Otherwise u ∉ N(v) and v ∉ N(u), so N(u), N(v) ⊆ V ∖ {u,v}, a set of 2n − 2 elements. Since |N(u)| + |N(v)| = 2n > 2n − 2, the sets N(u) and N(v) are not disjoint (pigeonhole principle); take w ∈ N(u) ∩ N(v). Then (u,w,v) is a u-v-path. By connected-pack G is connected. ∎", "sec": "Connectivity", "lecs": [2]}, {"name": "isomorphism-unpack", "type": "Definition", "needs": ["f is an isomorphism of G and H"], "gives": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)"], "say": "Since f is an isomorphism, f is a bijection and {u,v} ∈ E(G) if and only if {f(u),f(v)} ∈ E(H).", "src": "L2 slide 26", "formal": "f isomorphism of G and H ⟹ f bijection ∧ ∀u, v ∈ V(G): ({u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H))", "proof": "This is the definition, read in this direction.", "sec": "Isomorphism", "lecs": [2]}, {"name": "isomorphism-pack", "type": "Definition", "needs": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)"], "gives": ["f is an isomorphism of G and H"], "say": "f is a bijection that preserves edges and non-edges, hence f is an isomorphism of G and H.", "src": "L2 slide 26", "formal": "f bijection ∧ ∀u, v ∈ V(G): ({u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)) ⟹ f isomorphism of G and H", "proof": "This is the definition, read in this direction.", "sec": "Isomorphism", "lecs": [2]}, {"name": "isomorphic-unpack", "type": "Definition", "needs": ["G ≅ H"], "gives": ["f is an isomorphism of G and H"], "say": "Since G ≅ H, there is an isomorphism f of G and H.", "src": "L2 slide 27", "formal": "G ≅ H ⟹ ∃f: f isomorphism of G and H", "proof": "This is the definition, read in this direction. Fix one such f.", "sec": "Isomorphism", "lecs": [2]}, {"name": "isomorphic-pack", "type": "Definition", "needs": ["f is an isomorphism of G and H"], "gives": ["G ≅ H"], "say": "f is an isomorphism of G and H, hence G ≅ H.", "src": "L2 slide 27", "formal": "(∃f: f isomorphism of G and H) ⟹ G ≅ H", "proof": "This is the definition, read in this direction.", "sec": "Isomorphism", "lecs": [2]}, {"name": "automorphism-unpack", "type": "Definition", "needs": ["f is an automorphism of G"], "gives": ["f is an isomorphism of G and G"], "say": "An automorphism of G is an isomorphism of G with itself.", "src": "L2 slide 28", "formal": "f automorphism of G ⟹ f isomorphism of G and G", "proof": "This is the definition, read in this direction.", "sec": "Isomorphism", "lecs": [2]}, {"name": "automorphism-pack", "type": "Definition", "needs": ["f is an isomorphism of G and G"], "gives": ["f is an automorphism of G"], "say": "f is an isomorphism of G with itself, hence an automorphism of G.", "src": "L2 slide 28", "formal": "f isomorphism of G and G ⟹ f automorphism of G", "proof": "This is the definition, read in this direction.", "sec": "Isomorphism", "lecs": [2]}, {"name": "identity-automorphism", "type": "Fact", "needs": ["G is a graph on n vertices"], "gives": ["the identity map on V(G) is an automorphism of G"], "say": "The identity map is an automorphism of every graph.", "src": "T2 Ex 28", "formal": "id_{V(G)} is an automorphism of G", "proof": "id is a bijection V(G) → V(G), and {u,v} ∈ E(G) ⟺ {id(u),id(v)} ∈ E(G) trivially. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-same-vertices", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection"], "gives": ["|V(G)| = |V(H)|"], "say": "f is a bijection between the vertex sets, so G and H have the same number of vertices.", "src": "T2 Ex 19–21", "formal": "f : V(G) → V(H) bijection ⟹ |V(G)| = |V(H)|", "proof": "Two finite sets with a bijection between them have the same number of elements. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-same-edges", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)"], "gives": ["|E(G)| = |E(H)|"], "say": "An isomorphism maps edges to edges bijectively, so G and H have the same number of edges.", "src": "T2 Ex 19–21", "formal": "f isomorphism of G and H ⟹ |E(G)| = |E(H)|", "proof": "Define φ({u,v}) = {f(u),f(v)} for {u,v} ∈ E(G). By (⟹) of the edge condition, φ maps into E(H). φ is one-to-one because f is. φ is onto: for {x,y} ∈ E(H) put u = f⁻¹(x), v = f⁻¹(y); by (⟸), {u,v} ∈ E(G) and φ({u,v}) = {x,y}. So φ is a bijection E(G) → E(H). ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-preserves-degree", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)"], "gives": ["deg_H(f(v)) = deg_G(v) for every v ∈ V(G)"], "say": "An isomorphism maps the neighbors of v exactly onto the neighbors of f(v), so it preserves degrees.", "src": "T2 Ex 19–21", "formal": "f isomorphism of G and H ⟹ ∀v ∈ V(G): deg_H(f(v)) = deg_G(v)", "proof": "Let v ∈ V(G). For every w: w ∈ N_G(v) ⟺ {v,w} ∈ E(G) ⟺ {f(v),f(w)} ∈ E(H) ⟺ f(w) ∈ N_H(f(v)). Since f is a bijection, it maps N_G(v) one-to-one onto N_H(f(v)). Hence |N_G(v)| = |N_H(f(v))|. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-same-degree-sequence", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection", "deg_H(f(v)) = deg_G(v) for every v ∈ V(G)"], "gives": ["G and H have the same degree sequence"], "say": "Isomorphic graphs have the same degree sequence.", "src": "T2 Ex 19–21", "formal": "G ≅ H ⟹ the sorted lists of degrees of G and of H are equal", "proof": "f is a bijection V(G) → V(H) with deg_H(f(v)) = deg_G(v), so every degree value occurs equally often in G and in H. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-preserves-paths", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)"], "gives": ["(v₀,…,vₖ) is a path in G ⟺ (f(v₀),…,f(vₖ)) is a path in H"], "say": "An isomorphism maps paths to paths, in both directions.", "src": "T2 Ex 19–21", "formal": "f isomorphism ⟹ ((v₀,…,vₖ) path in G ⟺ (f(v₀),…,f(vₖ)) path in H)", "proof": "f is one-to-one, so v₀,…,vₖ are pairwise distinct ⟺ f(v₀),…,f(vₖ) are pairwise distinct. By the edge condition, {vᵢ₋₁,vᵢ} ∈ E(G) ⟺ {f(vᵢ₋₁),f(vᵢ)} ∈ E(H) for every i. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-preserves-connectivity", "type": "Fact", "needs": ["(v₀,…,vₖ) is a path in G ⟺ (f(v₀),…,f(vₖ)) is a path in H", "f : V(G) → V(H) is a bijection", "G is connected"], "gives": ["H is connected"], "say": "G is connected and the isomorphism maps paths of G to paths of H, so H is connected.", "src": "T2 Ex 19–21", "formal": "G ≅ H ∧ G connected ⟹ H connected", "proof": "Let x, y ∈ V(H), and put u = f⁻¹(x), v = f⁻¹(y). By connected-unpack there is a u-v-path (u = v₀,…,vₖ = v) in G. By iso-preserves-paths, (f(v₀),…,f(vₖ)) is a path in H from x to y. By connected-pack, H is connected. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-inverse", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)"], "gives": ["f⁻¹ is an isomorphism of H and G"], "say": "The inverse of an isomorphism is an isomorphism.", "src": "T2 Ex 22", "formal": "f isomorphism of G and H ⟹ f⁻¹ isomorphism of H and G", "proof": "f⁻¹ : V(H) → V(G) is a bijection. For x, y ∈ V(H) put u = f⁻¹(x), v = f⁻¹(y). Then {x,y} ∈ E(H) ⟺ {f(u),f(v)} ∈ E(H) ⟺ {u,v} ∈ E(G) ⟺ {f⁻¹(x),f⁻¹(y)} ∈ E(G). ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "isomorphic-symmetric", "type": "Fact", "needs": ["f⁻¹ is an isomorphism of H and G"], "gives": ["H ≅ G"], "say": "f⁻¹ is an isomorphism of H and G, hence H ≅ G.", "src": "L2 slide 27", "formal": "G ≅ H ⟹ H ≅ G", "proof": "By iso-inverse there is an isomorphism of H and G; apply the definition of H ≅ G. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-compose", "type": "Fact", "needs": ["f is an isomorphism of G and H", "g is an isomorphism of H and J"], "gives": ["g ∘ f is an isomorphism of G and J"], "say": "The composition of two isomorphisms is an isomorphism, so ≅ is transitive.", "src": "L2 slide 27", "formal": "f isomorphism of G, H ∧ g isomorphism of H, J ⟹ g ∘ f isomorphism of G, J", "proof": "g ∘ f is a bijection V(G) → V(J) as a composition of bijections. For u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H) ⟺ {g(f(u)),g(f(v))} ∈ E(J). ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "iso-complement", "type": "Fact", "needs": ["f : V(G) → V(H) is a bijection", "for all u, v ∈ V(G): {u,v} ∈ E(G) ⟺ {f(u),f(v)} ∈ E(H)", "Ḡ and H̄ are the complements of G and H"], "gives": ["f is an isomorphism of Ḡ and H̄"], "say": "The same bijection f is an isomorphism of the complements, because it preserves non-edges as well.", "src": "T2 Ex 22", "formal": "f isomorphism of G, H ⟹ f isomorphism of Ḡ, H̄", "proof": "V(Ḡ) = V(G) and V(H̄) = V(H), so f is a bijection V(Ḡ) → V(H̄). Let u, v ∈ V(G). If u = v, neither {u,v} nor {f(u),f(v)} is an edge. If u ≠ v then f(u) ≠ f(v), and by complement-unpack: {u,v} ∈ E(Ḡ) ⟺ {u,v} ∉ E(G) ⟺ {f(u),f(v)} ∉ E(H) ⟺ {f(u),f(v)} ∈ E(H̄). ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "complements-isomorphic", "type": "Fact", "needs": ["f is an isomorphism of Ḡ and H̄"], "gives": ["Ḡ ≅ H̄"], "say": "f is an isomorphism of Ḡ and H̄, hence Ḡ ≅ H̄.", "src": "T2 Ex 22", "formal": "G ≅ H ⟹ Ḡ ≅ H̄", "proof": "Apply the definition of isomorphic graphs to Ḡ, H̄ and f. (The converse follows by applying this to Ḡ, H̄, since the complement of Ḡ is G.) ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "regular-full-is-complete", "type": "Fact", "needs": ["G is (n−1)-regular", "G is a graph on n vertices"], "gives": ["G = Kₙ"], "say": "Every vertex has degree n − 1, so it is adjacent to all other vertices: G is the complete graph Kₙ.", "src": "T2 Ex 24", "formal": "G (n−1)-regular on n vertices ⟹ G = Kₙ", "proof": "By regular-unpack every vertex u has deg(u) = n − 1, so by universal-vertex N(u) = V ∖ {u}. Hence every two distinct vertices are adjacent, and by complete-pack G = Kₙ. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "complete-graphs-isomorphic", "type": "Fact", "needs": ["G = Kₙ", "H = Kₙ"], "gives": ["G ≅ H"], "say": "Any bijection between the vertex sets of two complete graphs on n vertices is an isomorphism.", "src": "T2 Ex 24", "formal": "G = Kₙ ∧ H = Kₙ ⟹ G ≅ H", "proof": "|V(G)| = |V(H)| = n, so there is a bijection f : V(G) → V(H). For u ≠ v we have f(u) ≠ f(v), and by complete-unpack both {u,v} ∈ E(G) and {f(u),f(v)} ∈ E(H) hold; for u = v neither holds. So f is an isomorphism. ∎", "sec": "Isomorphism", "lecs": [2]}, {"name": "forest-unpack", "type": "Definition", "needs": ["G is a forest"], "gives": ["G contains no cycle (G is acyclic)"], "say": "Since G is a forest, G contains no cycle.", "src": "L3 slide 9", "formal": "G forest ⟹ G has no subgraph isomorphic to a cycle", "proof": "This is the definition, read in this direction.", "sec": "Trees", "lecs": [3]}, {"name": "forest-pack", "type": "Definition", "needs": ["G contains no cycle (G is acyclic)"], "gives": ["G is a forest"], "say": "G contains no cycle, hence G is a forest.", "src": "L3 slide 9", "formal": "G has no subgraph isomorphic to a cycle ⟹ G forest", "proof": "This is the definition, read in this direction.", "sec": "Trees", "lecs": [3]}, {"name": "tree-unpack", "type": "Definition", "needs": ["G is a tree"], "gives": ["G contains no cycle (G is acyclic)", "G is connected"], "say": "Since G is a tree, G is connected and contains no cycle.", "src": "L3 slide 9", "formal": "G tree ⟹ G acyclic ∧ G connected", "proof": "This is the definition, read in this direction.", "sec": "Trees", "lecs": [3]}, {"name": "tree-pack", "type": "Definition", "needs": ["G contains no cycle (G is acyclic)", "G is connected"], "gives": ["G is a tree"], "say": "G is connected and contains no cycle, hence G is a tree.", "src": "L3 slide 9", "formal": "G acyclic ∧ G connected ⟹ G tree", "proof": "This is the definition, read in this direction.", "sec": "Trees", "lecs": [3]}, {"name": "leaf-unpack", "type": "Definition", "needs": ["v is a leaf of G"], "gives": ["deg(v) = 1"], "say": "Since v is a leaf, deg(v) = 1: v has exactly one neighbor.", "src": "L3 slide 9", "formal": "v leaf of G ⟹ deg_G(v) = 1", "proof": "This is the definition, read in this direction.", "sec": "Trees", "lecs": [3]}, {"name": "leaf-pack", "type": "Definition", "needs": ["deg(v) = 1"], "gives": ["v is a leaf of G"], "say": "deg(v) = 1, hence v is a leaf.", "src": "L3 slide 9", "formal": "deg_G(v) = 1 ⟹ v leaf of G", "proof": "This is the definition, read in this direction.", "sec": "Trees", "lecs": [3]}, {"name": "subgraph-acyclic", "type": "Fact", "needs": ["G contains no cycle (G is acyclic)", "H is a subgraph of G"], "gives": ["H contains no cycle"], "say": "H is a subgraph of the acyclic graph G, so H contains no cycle either.", "src": "L3 slide 12", "formal": "G acyclic ∧ H ⊆ G ⟹ H acyclic", "proof": "A cycle in H consists of vertices of V(H) ⊆ V(G) and edges of E(H) ⊆ E(G), so it would be a cycle in G. ∎", "sec": "Trees", "lecs": [3]}, {"name": "cycle-edge-removal", "type": "Fact", "needs": ["G is connected", "e is an edge of a cycle of G"], "gives": ["G − e is connected"], "say": "e lies on a cycle, so the rest of the cycle is a detour around e; hence G − e is still connected.", "src": "L3 slide 17", "formal": "G connected ∧ e ∈ E(C) for a cycle C ⊆ G ⟹ G − e connected", "proof": "Let e = {x,y} and let C be a cycle containing e. Removing e from C leaves an x-y-path Q in G − e. Let u, v ∈ V(G); by connected-unpack there is a u-v-path P in G. If e ∉ E(P), then P is a path in G − e. Otherwise replace the edge e in P by Q (traversed in the right direction); this gives a walk from u to v in G − e, and by walk-to-path there is a u-v-path in G − e. By connected-pack, G − e is connected. ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-two-leaves", "type": "Fact", "needs": ["G is a tree", "n ≥ 2"], "gives": ["G has at least two leaves"], "say": "By the theorem on the existence of leaves, every tree with at least two vertices has at least two leaves.", "src": "L3 slide 10", "formal": "G tree ∧ n ≥ 2 ⟹ |{v ∈ V(G) : deg(v) = 1}| ≥ 2", "proof": "Let P = (v₀,…,vₖ) be a longest path in G. Since G is connected and n ≥ 2, G has an edge, so k ≥ 1 and v₀ ≠ vₖ. We claim deg(v₀) = 1. Clearly v₁ ∈ N(v₀). Suppose v₀ has another neighbor w ≠ v₁. If w = vᵢ for some i ≥ 2, then v₀,v₁,…,vᵢ together with the edge {vᵢ,v₀} form a cycle — a contradiction with G being acyclic. If w ∉ V(P), then (w,v₀,…,vₖ) is a path longer than P — a contradiction with the choice of P. Hence deg(v₀) = 1. By symmetry deg(vₖ) = 1. ∎", "sec": "Trees", "lecs": [3]}, {"name": "leaf-removal-tree", "type": "Fact", "needs": ["G is a tree", "v is a leaf of G", "n ≥ 2"], "gives": ["G − v is a tree"], "say": "Removing a leaf from a tree gives a tree.", "src": "L3 slides 11–12", "formal": "G tree ∧ deg_G(v) = 1 ∧ n ≥ 2 ⟹ G − v tree", "proof": "Connected: let x, y ∈ V ∖ {v} and let P be an x-y-path in G (connected-unpack). If v ∈ V(P), then v is an inner vertex of P, so it has two different neighbors on P, contradicting deg(v) = 1. Hence P is a path in G − v. Acyclic: G − v is a subgraph of G, so by subgraph-acyclic it contains no cycle. By tree-pack, G − v is a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "leaf-addition-tree", "type": "Fact", "needs": ["G − v is a tree", "v is a leaf of G"], "gives": ["G is a tree"], "say": "Adding a leaf to a tree gives a tree.", "src": "L3 slides 11, 13", "formal": "G − v tree ∧ deg_G(v) = 1 ⟹ G tree", "proof": "Let w be the unique neighbor of v. Acyclic: a cycle of G not containing v lies in G − v, which is acyclic; a cycle containing v would give v two neighbors, contradicting deg(v) = 1. Connected: for x, y ≠ v there is an x-y-path in G − v, hence in G. For x ≠ v there is an x-w-path in G − v; it does not contain v, so extending it by the edge {w,v} gives an x-v-path in G. By tree-pack, G is a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-unique-paths", "type": "Fact", "needs": ["G is a tree"], "gives": ["for every two vertices u, v of G there is exactly one u-v-path in G"], "say": "In a tree, any two vertices are joined by exactly one path.", "src": "L3 slide 15 (1 ⇒ 2)", "formal": "G tree ⟹ ∀u, v ∈ V(G): ∃! u-v-path in G", "proof": "Existence: G is connected. Uniqueness: suppose P₁ = (a₁,…,aₖ) and P₂ = (b₁,…,b_ℓ) are two different u-v-paths. Neither is an initial part of the other (the end v would repeat), so there is a smallest i with aᵢ = bᵢ and aᵢ₊₁ ≠ bᵢ₊₁. Let p > i be the smallest index with a_p ∈ {bᵢ₊₁,…,b_ℓ}; it exists because aₖ = b_ℓ. Say a_p = b_q, q > i. Then aᵢ,aᵢ₊₁,…,a_p = b_q,b_{q−1},…,bᵢ₊₁ are pairwise distinct (by the choice of p) and consecutive ones are adjacent, as are bᵢ₊₁ and bᵢ = aᵢ. Their number is (p − i) + (q − i) ≥ 3, since p − i = q − i = 1 would give aᵢ₊₁ = bᵢ₊₁. So they form a cycle in G — a contradiction. ∎", "sec": "Trees", "lecs": [3]}, {"name": "unique-paths-tree", "type": "Fact", "needs": ["for every two vertices u, v of G there is exactly one u-v-path in G"], "gives": ["G is a tree"], "say": "Any two vertices are joined by exactly one path, so G is connected, and G has no cycle because a cycle gives two paths between two of its vertices.", "src": "L3 slide 16 (2 ⇒ 1)", "formal": "(∀u, v: ∃! u-v-path) ⟹ G tree", "proof": "G is connected by connected-pack. Suppose G contains a cycle with vertices c₁,c₂,…,c_m in this order, m ≥ 3. Then (c₁,c₂) and (c₁,c_m,c_{m−1},…,c₂) are two different c₁-c₂-paths — a contradiction. So G is acyclic, and by tree-pack a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-edges-are-bridges", "type": "Fact", "needs": ["G is a tree"], "gives": ["G − e is disconnected for every edge e of G"], "say": "In a tree, removing any edge disconnects the graph.", "src": "L3 slide 17 (1 ⇒ 3)", "formal": "G tree ⟹ ∀e ∈ E(G): G − e disconnected", "proof": "For the sake of contradiction, suppose G − e is connected for some e = {u,v} ∈ E. Then there is a u-v-path in G − e; it does not use e, so it has length at least 2, and together with e it forms a cycle in G. This contradicts G being acyclic. ∎", "sec": "Trees", "lecs": [3]}, {"name": "bridges-tree", "type": "Fact", "needs": ["G is connected", "G − e is disconnected for every edge e of G"], "gives": ["G is a tree"], "say": "G is connected and removing any edge disconnects it, so no edge lies on a cycle: G is a tree.", "src": "L3 slide 18 (3 ⇒ 1)", "formal": "G connected ∧ (∀e ∈ E(G): G − e disconnected) ⟹ G tree", "proof": "It suffices to show that G is acyclic. Suppose G contains a cycle C and let e ∈ E(C). By cycle-edge-removal, G − e is connected, contradicting the assumption. Hence G is acyclic and connected; by tree-pack G is a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-edge-count", "type": "Fact", "needs": ["G is a tree"], "gives": ["|E(G)| = n − 1"], "say": "A tree on n vertices has exactly n − 1 edges.", "src": "L3 slide 19 (1 ⇒ 4)", "formal": "G tree ⟹ |E(G)| = |V(G)| − 1", "proof": "By induction on n. For n = 1 there is no edge, and 0 = 1 − 1. Let n > 1. By tree-two-leaves G has a leaf v, and by leaf-removal-tree G′ = G − v is a tree on n − 1 vertices. By the induction hypothesis |E(G′)| = n − 2. G′ arises from G by deleting v and its single edge, so |E(G)| = |E(G′)| + 1 = n − 1. ∎", "sec": "Trees", "lecs": [3]}, {"name": "edge-count-tree", "type": "Fact", "needs": ["G is connected", "|E(G)| = n − 1"], "gives": ["G is a tree"], "say": "G is connected and has n − 1 edges, hence G is a tree.", "src": "L3 slide 20 (4 ⇒ 1)", "formal": "G connected ∧ |E(G)| = |V(G)| − 1 ⟹ G tree", "proof": "By induction on n. For n = 1 the graph has no edge and is a tree. Let n > 1. By degree-sum, Σ deg(u) = 2|E| = 2n − 2 < 2n, so some vertex v has deg(v) ≤ 1. By connected-min-degree deg(v) ≥ 1, so v is a leaf. G′ = G − v is connected (a path between two other vertices cannot pass through the leaf v) and |E(G′)| = |E| − 1 = (n − 1) − 1. By the induction hypothesis G′ is a tree, and by leaf-addition-tree G is a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-degree-sum", "type": "Fact", "needs": ["|E(G)| = n − 1", "Σ deg(v) = 2·|E(G)|"], "gives": ["Σ deg(v) = 2n − 2"], "say": "A tree has n − 1 edges, so by the Degree Sum Formula its degrees sum to 2n − 2.", "src": "L3 slide 20", "formal": "|E| = n − 1 ⟹ Σ_{v∈V} deg(v) = 2n − 2", "proof": "Σ deg(v) = 2|E| = 2(n − 1). ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-leaves-max-degree", "type": "Fact", "needs": ["G is a tree", "Δ ≥ 2 is the maximum degree of G"], "gives": ["G has at least Δ leaves"], "say": "Counting degrees: one vertex has degree Δ, the leaves have degree 1, all others at least 2, and the total is 2n − 2; this forces at least Δ leaves.", "src": "T2 Ex 32", "formal": "G tree ∧ Δ(G) ≥ 2 ⟹ G has at least Δ(G) leaves", "proof": "Let ℓ be the number of leaves and x a vertex with deg(x) = Δ ≥ 2 (so x is not a leaf and n ≥ 3). By connected-min-degree every vertex has degree at least 1, so every vertex that is neither a leaf nor x has degree at least 2. Hence Σ deg(v) ≥ ℓ + Δ + 2(n − ℓ − 1). By tree-edge-count and tree-degree-sum, Σ deg(v) = 2n − 2. So 2n − 2 ≥ 2n − 2 + Δ − ℓ, i.e. ℓ ≥ Δ. ∎", "sec": "Trees", "lecs": [3]}, {"name": "forest-edge-count", "type": "Fact", "needs": ["G is a forest with c connected components"], "gives": ["|E(G)| = n − c"], "say": "Each component of a forest is a tree, so a forest with c components has n − c edges.", "src": "L3 slide 9", "formal": "G forest with c components ⟹ |E(G)| = n − c", "proof": "Let H₁,…,H_c be the components, with nᵢ vertices. Each Hᵢ is connected and, by subgraph-acyclic, acyclic; so it is a tree and by tree-edge-count |E(Hᵢ)| = nᵢ − 1. By components-partition Σ nᵢ = n, and by no-edge-between-components every edge of G lies in exactly one component. Hence |E(G)| = Σ (nᵢ − 1) = n − c. ∎", "sec": "Trees", "lecs": [3]}, {"name": "tree-add-edge-cycle", "type": "Fact", "needs": ["G is a tree"], "gives": ["for every two non-adjacent vertices u, v of G, the graph G + {u,v} contains a cycle"], "say": "In a tree, two non-adjacent vertices are joined by a path of length at least 2; adding the edge between them closes a cycle.", "src": "T2 Ex 31 (⇒)", "formal": "G tree ⟹ ∀ non-adjacent u ≠ v: G + {u,v} contains a cycle", "proof": "Let u ≠ v be non-adjacent. G is connected, so there is a u-v-path P in G; since {u,v} ∉ E(G), P has length at least 2. P together with the new edge {u,v} is a cycle in G + {u,v}. ∎", "sec": "Trees", "lecs": [3]}, {"name": "maximal-acyclic-tree", "type": "Fact", "needs": ["G contains no cycle (G is acyclic)", "for every two non-adjacent vertices u, v of G, the graph G + {u,v} contains a cycle"], "gives": ["G is a tree"], "say": "G has no cycle, but adding any edge creates one; the cycle must use the new edge, and the rest of it is a path joining its ends. So G is connected, hence a tree.", "src": "T2 Ex 31 (⇐)", "formal": "G acyclic ∧ (∀ non-adjacent u ≠ v: G + {u,v} contains a cycle) ⟹ G tree", "proof": "Let u ≠ v ∈ V(G). If {u,v} ∈ E(G), then (u,v) is a u-v-path. Otherwise G + {u,v} contains a cycle C. C is not a cycle of G (G is acyclic), so C contains the edge {u,v}; removing this edge from C leaves a u-v-path in G. So any two vertices are joined by a path; by connected-pack G is connected, and by tree-pack G is a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "path-is-tree", "type": "Fact", "needs": ["G = Pₙ"], "gives": ["G is a tree"], "say": "The path Pₙ is connected and has n − 1 edges, hence it is a tree.", "src": "L3 slide 10 (note)", "formal": "G = Pₙ ⟹ G tree", "proof": "Pₙ is connected: for i < j, (i,i+1,…,j) is an i-j-path. By path-graph-unpack it has n vertices and n − 1 edges. By edge-count-tree it is a tree. ∎", "sec": "Trees", "lecs": [3]}, {"name": "spanning-tree-unpack", "type": "Definition", "needs": ["T is a spanning tree of G"], "gives": ["T is a subgraph of G", "V(T) = V(G)", "T is a tree"], "say": "Since T is a spanning tree of G, T is a subgraph of G, V(T) = V(G), and T is a tree.", "src": "L3 slide 22", "formal": "T spanning tree of G ⟹ T ⊆ G ∧ V(T) = V(G) ∧ T tree", "proof": "This is the definition, read in this direction.", "sec": "Spanning trees", "lecs": [3]}, {"name": "spanning-tree-pack", "type": "Definition", "needs": ["T is a subgraph of G", "V(T) = V(G)", "T is a tree"], "gives": ["T is a spanning tree of G"], "say": "T is a subgraph of G on all vertices of G, and T is a tree; hence T is a spanning tree of G.", "src": "L3 slide 22", "formal": "T ⊆ G ∧ V(T) = V(G) ∧ T tree ⟹ T spanning tree of G", "proof": "This is the definition, read in this direction.", "sec": "Spanning trees", "lecs": [3]}, {"name": "spanning-tree-exists", "type": "Fact", "needs": ["G is connected"], "gives": ["G has a spanning tree"], "say": "Every connected graph has a spanning tree.", "src": "L3 slides 22–25", "formal": "G connected ⟹ ∃T: T spanning tree of G", "proof": "Consider all connected subgraphs of G with vertex set V(G); G is one of them. Choose one, T, with the minimum number of edges. If T contained a cycle C, then for e ∈ E(C) the graph T − e would be connected by cycle-edge-removal, a connected subgraph on V(G) with fewer edges — a contradiction. So T is acyclic and connected, i.e. a tree, with V(T) = V(G). ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "spanning-tree-connected", "type": "Fact", "needs": ["G has a spanning tree"], "gives": ["G is connected"], "say": "G has a spanning tree; paths in the tree are paths in G, so G is connected.", "src": "L3 slide 22", "formal": "G has a spanning tree ⟹ G connected", "proof": "Let T be a spanning tree and u, v ∈ V(G) = V(T). T is connected, so there is a u-v-path in T; by subgraph-path it is a path in G. By connected-pack, G is connected. ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "spanning-tree-edge-count", "type": "Fact", "needs": ["V(T) = V(G)", "T is a tree"], "gives": ["|E(T)| = n − 1"], "say": "A spanning tree of G is a tree on n vertices, so it has n − 1 edges.", "src": "L3 slide 22", "formal": "T spanning tree of G ⟹ |E(T)| = |V(G)| − 1", "proof": "T is a tree with |V(T)| = |V(G)| = n; apply tree-edge-count to T. ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "connected-min-edges", "type": "Fact", "needs": ["G has a spanning tree"], "gives": ["|E(G)| ≥ n − 1"], "say": "A connected graph contains a spanning tree with n − 1 edges, so it has at least n − 1 edges.", "src": "L3 slide 22", "formal": "G connected ⟹ |E(G)| ≥ n − 1", "proof": "Let T be a spanning tree of G. Then E(T) ⊆ E(G) and by spanning-tree-edge-count |E(T)| = n − 1. ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "spanning-tree-exchange", "type": "Fact", "needs": ["T is a spanning tree of G", "e ∈ E(G) ∖ E(T)"], "gives": ["there is an edge e′ ∈ E(T) such that (T + e) − e′ is a spanning tree of G"], "say": "Adding e to the spanning tree creates a cycle; removing another edge of that cycle gives a spanning tree again.", "src": "T3 Ex 1", "formal": "T spanning tree of G ∧ e ∈ E(G) ∖ E(T) ⟹ ∃e′ ∈ E(T): (T + e) − e′ spanning tree of G", "proof": "The ends of e are not adjacent in T, so by tree-add-edge-cycle T + e contains a cycle C, and C contains e because T is acyclic. C has at least 3 edges; choose e′ ∈ E(C), e′ ≠ e, so e′ ∈ E(T). T + e is connected, so by cycle-edge-removal T′ = (T + e) − e′ is connected. It has (n − 1) + 1 − 1 = n − 1 edges, so by edge-count-tree T′ is a tree. V(T′) = V(G) and E(T′) ⊆ E(G), so T′ is a spanning tree of G. ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "edge-in-spanning-tree", "type": "Fact", "needs": ["G is connected", "e ∈ E(G)"], "gives": ["G has a spanning tree that contains e"], "say": "Take any spanning tree; if it does not contain e, exchange e into it.", "src": "T3 Ex 3", "formal": "G connected ∧ e ∈ E(G) ⟹ ∃T spanning tree of G: e ∈ E(T)", "proof": "By spanning-tree-exists G has a spanning tree T. If e ∈ E(T) we are done. Otherwise, by spanning-tree-exchange there is e′ ∈ E(T) such that (T + e) − e′ is a spanning tree of G, and it contains e. ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "cycle-spanning-trees", "type": "Fact", "needs": ["G = Cₙ"], "gives": ["G has exactly n spanning trees"], "say": "A spanning tree of Cₙ has n − 1 of its n edges, and removing any one edge leaves a path; so Cₙ has exactly n spanning trees.", "src": "T3 Ex 5", "formal": "G = Cₙ ⟹ #{spanning trees of G} = n", "proof": "By spanning-tree-edge-count a spanning tree has n − 1 edges, and Cₙ has n edges, so a spanning tree arises by removing exactly one edge. Removing any edge e leaves a connected graph (cycle-edge-removal) with n − 1 edges, which is a tree by edge-count-tree. The n choices of e give n different spanning trees. ∎", "sec": "Spanning trees", "lecs": [3]}, {"name": "symmetrization-unpack", "type": "Definition", "needs": ["G is a directed graph"], "gives": ["sym(G) is the undirected graph on V(G) with {u,v} ∈ E(sym(G)) ⟺ (u,v) ∈ E(G) or (v,u) ∈ E(G)"], "say": "The symmetrization sym(G) forgets the directions of all arcs.", "src": "L3 slide 5", "formal": "sym(G) := (V, E′) with {u,v} ∈ E′ ⟺ (u,v) ∈ E ∨ (v,u) ∈ E", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [3]}, {"name": "weakly-connected-unpack", "type": "Definition", "needs": ["G is weakly connected"], "gives": ["sym(G) is connected"], "say": "Since G is weakly connected, its symmetrization sym(G) is connected.", "src": "L3 slide 5", "formal": "G weakly connected ⟹ sym(G) connected", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [3]}, {"name": "weakly-connected-pack", "type": "Definition", "needs": ["sym(G) is connected"], "gives": ["G is weakly connected"], "say": "sym(G) is connected, hence G is weakly connected.", "src": "L3 slide 5", "formal": "sym(G) connected ⟹ G weakly connected", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [3]}, {"name": "strongly-connected-unpack", "type": "Definition", "needs": ["G is strongly connected"], "gives": ["for every two vertices u, v there is a directed path from u to v and a directed path from v to u"], "say": "Since G is strongly connected, for every two vertices u, v there is a directed path from u to v and one from v to u.", "src": "L3 slide 6", "formal": "G strongly connected ⟹ ∀u, v ∈ V: ∃ directed u-v-path ∧ ∃ directed v-u-path", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [3]}, {"name": "strongly-connected-pack", "type": "Definition", "needs": ["for every two vertices u, v there is a directed path from u to v and a directed path from v to u"], "gives": ["G is strongly connected"], "say": "Any two vertices are joined by directed paths in both directions, hence G is strongly connected.", "src": "L3 slide 6", "formal": "(∀u, v ∈ V: ∃ directed u-v-path ∧ ∃ directed v-u-path) ⟹ G strongly connected", "proof": "This is the definition, read in this direction.", "sec": "Directed graphs", "lecs": [3]}, {"name": "strong-implies-weak", "type": "Fact", "needs": ["for every two vertices u, v there is a directed path from u to v and a directed path from v to u"], "gives": ["sym(G) is connected"], "say": "Forgetting directions turns a directed path into a walk of sym(G), so a strongly connected graph is weakly connected.", "src": "L3 slides 5–6", "formal": "G strongly connected ⟹ sym(G) connected", "proof": "Let u, v ∈ V. There is a directed path (u = v₀,…,vₖ = v) with (vᵢ₋₁,vᵢ) ∈ E for all i. By the definition of sym(G), {vᵢ₋₁,vᵢ} ∈ E(sym(G)) whenever vᵢ₋₁ ≠ vᵢ, so the same sequence is a walk from u to v in sym(G); by walk-to-path there is a u-v-path. By connected-pack, sym(G) is connected. ∎", "sec": "Directed graphs", "lecs": [3]}, {"name": "weighted-digraph-unpack", "type": "Definition", "needs": ["(G, ℓ) is a weighted digraph"], "gives": ["G is a directed graph", "every edge e has a
