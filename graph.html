length ℓ(e) ∈ ℝ, and a walk W has length ℓ(W) = Σ_{e∈W} ℓ(e)"], "say": "Since (G, ℓ) is a weighted digraph, every edge e has a length ℓ(e), and the length of a walk is the sum of the lengths of its edges.", "src": "L12 slide 2", "formal": "(G, ℓ) weighted digraph ⟹ G directed ∧ ℓ : E → ℝ ∧ ℓ(W) = Σ_{e∈W} ℓ(e)", "proof": "This is the definition, read in this direction.", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "weighted-distance-unpack", "type": "Definition", "needs": ["d(u, v) = k"], "gives": ["some uv-path has length k, and every uv-path has length ≥ k (d(u, v) = +∞ if there is no uv-path)"], "say": "Since d(u, v) = k, some uv-path has length k and no uv-path is shorter.", "src": "L12 slide 3", "formal": "d(u, v) := min{ℓ(P) : P a uv-path}, or +∞ if there is none", "proof": "This is the definition, read in this direction. The minimum exists because a graph has finitely many paths. In a digraph d(u, v) and d(v, u) may differ.", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "weighted-distance-pack", "type": "Definition", "needs": ["some uv-path has length k, and every uv-path has length ≥ k (d(u, v) = +∞ if there is no uv-path)"], "gives": ["d(u, v) = k"], "say": "Some uv-path has length k and none is shorter, so d(u, v) = k.", "src": "L12 slide 3", "formal": "(∃ uv-path of length k) ∧ (every uv-path has length ≥ k) ⟹ d(u, v) = k", "proof": "This is the definition, read in this direction.", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "positive-is-nonnegative", "type": "Fact", "needs": ["all edge lengths are positive"], "gives": ["all edge lengths are nonnegative"], "say": "Positive lengths are in particular nonnegative.", "src": "L12 slide 2", "formal": "ℓ(e) > 0 ∀e ⟹ ℓ(e) ≥ 0 ∀e", "proof": "Trivial. ∎", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "nonnegative-no-negative-cycle", "type": "Fact", "needs": ["all edge lengths are nonnegative"], "gives": ["G contains no negative cycle"], "say": "With nonnegative lengths every cycle has nonnegative length, so there is no negative cycle.", "src": "L12 slide 29", "formal": "ℓ ≥ 0 ⟹ no cycle C has ℓ(C) < 0", "proof": "The length of a cycle is a sum of nonnegative numbers. ∎", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "walk-contraction", "type": "Fact", "needs": ["G contains no negative cycle", "W is a uv-walk in G"], "gives": ["there is a uv-path P with ℓ(P) ≤ ℓ(W)"], "say": "Every uv-walk contains a uv-path that is not longer (Walk Contraction Lemma).", "src": "L12 slides 5–6 (nonnegative lengths); slide 30 (no negative cycle)", "formal": "no negative cycle ∧ W a uv-walk ⟹ ∃ uv-path P with ℓ(P) ≤ ℓ(W)", "proof": "If W is not a path, some vertex repeats; let t be the first such vertex (from u). Cut out the part of W between the first and the last occurrence of t. That part is a closed walk, which splits into cycles, none of them negative, so its length is ≥ 0 (with nonnegative lengths this is immediate). The result is a shorter-or-equal uv-walk with at least one edge fewer. Repeat until no vertex repeats: this gives a uv-path P with ℓ(P) ≤ ℓ(W). ∎", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "shortest-walk-is-path", "type": "Fact", "needs": ["G contains no negative cycle"], "gives": ["a shortest uv-walk exists, and its length is d(u, v)"], "say": "A shortest uv-walk exists and its length equals the length of a shortest uv-path, d(u, v).", "src": "L12 slide 7", "formal": "no negative cycle ∧ v reachable from u ⟹ min{ℓ(W) : W a uv-walk} = d(u, v)", "proof": "Let P be a shortest uv-path. If some uv-walk W were shorter than P, walk-contraction would give a uv-path not longer than W, hence shorter than P — a contradiction. So P is a shortest uv-walk. ∎", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "triangle-inequality", "type": "Fact", "needs": ["G contains no negative cycle"], "gives": ["d(u, v) ≤ d(u, w) + d(w, v) for all vertices u, v, w"], "say": "By the triangle inequality, d(u, v) ≤ d(u, w) + d(w, v).", "src": "L12 slide 8 (also slide 29)", "formal": "no negative cycle ⟹ ∀u, v, w: d(u, v) ≤ d(u, w) + d(w, v)", "proof": "If d(u, w) or d(w, v) is +∞ there is nothing to prove. Otherwise join a shortest uw-path and a shortest wv-path: this is a uv-walk of length d(u, w) + d(w, v). By shortest-walk-is-path it is not shorter than d(u, v). ∎", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "subpath-of-shortest-path", "type": "Fact", "needs": ["P is a shortest uv-path and w is a vertex of P", "d(u, v) ≤ d(u, w) + d(w, v) for all vertices u, v, w"], "gives": ["the part of P from u to w is a shortest uw-path, and the part from w to v is a shortest wv-path"], "say": "Every part of a shortest path is a shortest path between its ends.", "src": "L12 slide 9", "formal": "P shortest uv-path, w ∈ V(P) ⟹ P_uw shortest uw-path ∧ P_wv shortest wv-path", "proof": "By the triangle inequality, ℓ(P) = d(u, v) ≤ d(u, w) + d(w, v) ≤ ℓ(P_uw) + ℓ(P_wv) = ℓ(P). So equality holds throughout, and since d(u, w) ≤ ℓ(P_uw) and d(w, v) ≤ ℓ(P_wv), both must be equalities: ℓ(P_uw) = d(u, w) and ℓ(P_wv) = d(w, v). ∎", "sec": "Weighted graphs and distances", "lecs": [12]}, {"name": "rooted-tree-unpack", "type": "Definition", "needs": ["(T, r) is a rooted tree"], "gives": ["T is a tree", "r ∈ V(T)"], "say": "Since (T, r) is a rooted tree, T is a tree and r is one of its vertices, the root.", "src": "L4 slide 16", "formal": "(T, r) rooted tree ⟹ T tree ∧ r ∈ V(T)", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "rooted-tree-pack", "type": "Definition", "needs": ["T is a tree", "r ∈ V(T)"], "gives": ["(T, r) is a rooted tree"], "say": "T is a tree and r ∈ V(T), hence (T, r) is a rooted tree.", "src": "L4 slide 16", "formal": "T tree ∧ r ∈ V(T) ⟹ (T, r) rooted tree", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "ancestor-unpack", "type": "Definition", "needs": ["u is an ancestor of v in (T, r)"], "gives": ["u lies on the v-r-path in T"], "say": "Since u is an ancestor of v, u lies on the path from v to the root.", "src": "L4 slide 16", "formal": "u ancestor of v ⟹ u ∈ V(P), where P is the unique v-r-path in T", "proof": "This is the definition, read in this direction. (Equivalently: v is a descendant of u.) The path is unique by tree-unique-paths.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "ancestor-pack", "type": "Definition", "needs": ["u lies on the v-r-path in T"], "gives": ["u is an ancestor of v in (T, r)"], "say": "u lies on the path from v to the root, hence u is an ancestor of v and v is a descendant of u.", "src": "L4 slide 16", "formal": "u ∈ V(P), P the v-r-path in T ⟹ u ancestor of v", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "parent-unpack", "type": "Definition", "needs": ["u is the parent of v in (T, r)"], "gives": ["u is an ancestor of v in (T, r)", "{u,v} ∈ E(T)"], "say": "Since u is the parent of v, u is an ancestor of v and {u,v} is an edge of T.", "src": "L4 slide 16", "formal": "u parent of v ⟹ u ancestor of v ∧ {u,v} ∈ E(T)", "proof": "This is the definition, read in this direction. (Equivalently: v is a child of u.)", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "parent-pack", "type": "Definition", "needs": ["u is an ancestor of v in (T, r)", "{u,v} ∈ E(T)"], "gives": ["u is the parent of v in (T, r)"], "say": "u is an ancestor of v and adjacent to v, hence u is the parent of v and v is a child of u.", "src": "L4 slide 16", "formal": "u ancestor of v ∧ {u,v} ∈ E(T) ⟹ u parent of v", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "unique-parent", "type": "Fact", "needs": ["(T, r) is a rooted tree", "v ≠ r is a vertex of T"], "gives": ["v has exactly one parent"], "say": "Every vertex other than the root has exactly one parent: the second vertex on its path to the root.", "src": "L4 slide 16", "formal": "(T, r) rooted tree ∧ v ≠ r ⟹ ∃! u: u parent of v", "proof": "By tree-unique-paths there is exactly one v-r-path P = (v = a₀,a₁,…,aₘ = r), and m ≥ 1 because v ≠ r. Existence: a₁ lies on P and {a₁,v} ∈ E(T), so a₁ is a parent of v. Uniqueness: let u be a parent of v. Then u = aᵢ for some i, and i ≥ 1 since {u,v} is an edge. If i ≥ 2, the vertices a₀,a₁,…,aᵢ with the edge {aᵢ,a₀} form a cycle in T — a contradiction. Hence u = a₁. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "level-unpack", "type": "Definition", "needs": ["v is at level i of (T, r)"], "gives": ["the v-r-path in T has length i"], "say": "v is at level i, i.e. its path to the root has i edges.", "src": "L4 slide 16", "formal": "v at level i ⟹ the v-r-path has length i", "proof": "This is the definition, read in this direction. The root is at level 0, its children at level 1, and so on. The depth of the rooted tree is the number of its levels.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "level-pack", "type": "Definition", "needs": ["the v-r-path in T has length i"], "gives": ["v is at level i of (T, r)"], "say": "The path from v to the root has i edges, so v is at level i.", "src": "L4 slide 16", "formal": "the v-r-path has length i ⟹ v at level i", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "child-level", "type": "Fact", "needs": ["(T, r) is a rooted tree", "v is at level i of (T, r)"], "gives": ["every child of v is at level i + 1"], "say": "A child's path to the root goes through its parent, so it is one edge longer: children are one level below.", "src": "L4 slide 16", "formal": "v at level i ∧ w child of v ⟹ w at level i + 1", "proof": "Let w be a child of v. Then v lies on the w-r-path P and {v,w} ∈ E(T), so as in unique-parent v is the second vertex of P: P = (w,v,…,r). The part of P from v to r is the v-r-path, of length i. Hence P has length i + 1. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "binary-tree-unpack", "type": "Definition", "needs": ["(T, r) is a binary tree"], "gives": ["(T, r) is a rooted tree", "every vertex of T has at most two children, each marked as left or right"], "say": "Since T is a binary tree, it is rooted and every vertex has at most two children, a left one and a right one.", "src": "L4 slide 18", "formal": "(T, r) binary tree ⟹ (T, r) rooted ∧ every vertex has ≤ 2 children, each left or right", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "binary-tree-pack", "type": "Definition", "needs": ["(T, r) is a rooted tree", "every vertex of T has at most two children, each marked as left or right"], "gives": ["(T, r) is a binary tree"], "say": "T is rooted and every vertex has at most two children with assigned positions, hence T is a binary tree.", "src": "L4 slide 18", "formal": "(T, r) rooted ∧ every vertex has ≤ 2 children, each left or right ⟹ (T, r) binary tree", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "binary-level-size", "type": "Fact", "needs": ["(T, r) is a rooted tree", "every vertex of T has at most two children, each marked as left or right"], "gives": ["level i of T contains at most 2ⁱ vertices"], "say": "Level 0 has one vertex, and each level has at most twice as many vertices as the one above; so level i has at most 2ⁱ vertices.", "src": "L4 slide 21", "formal": "(T, r) binary tree ⟹ ∀i ≥ 0: |{v : v at level i}| ≤ 2ⁱ", "proof": "By induction on i. Level 0 contains only the root: 1 = 2⁰. Let i ≥ 1. Every vertex at level i is not the root, so by unique-parent it has a parent, which by child-level is at level i − 1. Each vertex of level i − 1 has at most two children. Hence level i has at most 2 · 2ⁱ⁻¹ = 2ⁱ vertices by the induction hypothesis. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "binary-tree-size", "type": "Fact", "needs": ["level i of T contains at most 2ⁱ vertices"], "gives": ["if T has ℓ levels, then T has at most 2^ℓ − 1 vertices"], "say": "Summing 2ⁱ over the ℓ levels gives at most 2^ℓ − 1 vertices.", "src": "L4 slide 21", "formal": "(T, r) binary tree with ℓ levels ⟹ |V(T)| ≤ 2^ℓ − 1", "proof": "The levels 0,…,ℓ − 1 partition V(T), and level i has at most 2ⁱ vertices. Hence |V(T)| ≤ 2⁰ + 2¹ + ⋯ + 2^{ℓ−1} = 2^ℓ − 1. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-unpack", "type": "Definition", "needs": ["H is a (minimum) binary heap with n elements"], "gives": ["H is a binary tree with a key k(x) in every vertex x", "heap shape: all levels of H except the last are completely filled, and the last is filled from the left", "heap order: k(v) ≤ k(s) whenever s is a child of v"], "say": "Since H is a heap, it is a binary tree with keys that satisfies the heap shape and the heap order.", "src": "L4 slide 19", "formal": "H heap ⟹ H binary tree with keys ∧ heap shape ∧ heap order", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-pack", "type": "Definition", "needs": ["H is a binary tree with a key k(x) in every vertex x", "heap shape: all levels of H except the last are completely filled, and the last is filled from the left", "heap order: k(v) ≤ k(s) whenever s is a child of v"], "gives": ["H is a (minimum) binary heap with n elements"], "say": "H is a binary tree with keys that satisfies the heap shape and the heap order, hence H is a heap.", "src": "L4 slide 19", "formal": "H binary tree with keys ∧ heap shape ∧ heap order ⟹ H heap", "proof": "This is the definition, read in this direction.", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-path-monotone", "type": "Fact", "needs": ["heap order: k(v) ≤ k(s) whenever s is a child of v"], "gives": ["on the path from any vertex to the root, the keys do not increase"], "say": "By the heap order, each step from a vertex to its parent does not increase the key.", "src": "L4 slide 20 (Observation)", "formal": "heap order ⟹ for the path (v = a₀,a₁,…,aₘ = root): k(a₀) ≥ k(a₁) ≥ ⋯ ≥ k(aₘ)", "proof": "On the path from v to the root, aⱼ₊₁ is the parent of aⱼ (unique-parent). By the heap order, k(aⱼ₊₁) ≤ k(aⱼ) for every j. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-min-at-root", "type": "Fact", "needs": ["on the path from any vertex to the root, the keys do not increase"], "gives": ["the root of H holds the minimum key"], "say": "Keys do not increase on the way to the root, so the root holds the minimum.", "src": "L4 slide 20 (Observation)", "formal": "∀v ∈ V(H): k(root) ≤ k(v)", "proof": "Let v be any vertex. The keys on the path from v to the root do not increase, so k(root) ≤ k(v). ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-levels", "type": "Fact", "needs": ["heap shape: all levels of H except the last are completely filled, and the last is filled from the left"], "gives": ["H has ⌊log₂ n⌋ + 1 levels"], "say": "A heap with n elements has ⌊log₂ n⌋ + 1 levels.", "src": "L4 slide 21", "formal": "heap shape, n ≥ 1 elements, ℓ levels ⟹ ℓ = ⌊log₂ n⌋ + 1", "proof": "Let ℓ be the number of levels. By the heap shape, the levels 0,…,ℓ − 2 are full and contain 2⁰ + ⋯ + 2^{ℓ−2} = 2^{ℓ−1} − 1 vertices, and the last level contains at least 1 and at most 2^{ℓ−1} vertices. Hence 2^{ℓ−1} ≤ n ≤ 2^ℓ − 1 < 2^ℓ, so ℓ − 1 ≤ log₂ n < ℓ, i.e. ⌊log₂ n⌋ = ℓ − 1. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-indices", "type": "Fact", "needs": ["heap shape: all levels of H except the last are completely filled, and the last is filled from the left"], "gives": ["numbering the vertices 1,…,n level by level from the left: vertex i has children 2i and 2i + 1 and parent ⌊i/2⌋"], "say": "With the vertices numbered level by level, the children of vertex i are 2i and 2i + 1, and its parent is ⌊i/2⌋.", "src": "L4 slide 31 (Observation)", "formal": "index(left child of i) = 2i, index(right child of i) = 2i + 1, index(parent of i) = ⌊i/2⌋", "proof": "The levels 0,…,j − 1 are full and contain 2ʲ − 1 vertices, so level j holds the indices 2ʲ,…,2ʲ⁺¹ − 1, and the vertex at position p (counted from 0) of level j has index i = 2ʲ + p. The p vertices to its left have 2p children, which come first in level j + 1; so its children are at positions 2p and 2p + 1 of level j + 1, i.e. they have indices 2ʲ⁺¹ + 2p = 2i and 2i + 1 (when these do not exceed n). Conversely, the parent of 2i and of 2i + 1 is i = ⌊2i/2⌋ = ⌊(2i + 1)/2⌋. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "heap-leaves", "type": "Fact", "needs": ["numbering the vertices 1,…,n level by level from the left: vertex i has children 2i and 2i + 1 and parent ⌊i/2⌋"], "gives": ["H has exactly ⌈n/2⌉ vertices without children"], "say": "Vertex i has a child exactly when 2i ≤ n, so the ⌊n/2⌋ first vertices have children and the remaining ⌈n/2⌉ are leaves.", "src": "L4 slide 22", "formal": "#{vertices of H without children} = ⌈n/2⌉", "proof": "By heap-indices, vertex i has a child if and only if 2i ≤ n, i.e. i ≤ ⌊n/2⌋. So exactly ⌊n/2⌋ vertices have a child, and n − ⌊n/2⌋ = ⌈n/2⌉ have none. (The lecture states this for n ≥ 3 and proves it by counting insertions.) ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "weighted-geometric-sum", "type": "Fact", "needs": ["k ≥ 0 is an integer"], "gives": ["Σ_{q=0}^{k} q/2^q = 2 − (k + 2)/2^k"], "say": "By induction on k, Σ q/2^q = 2 − (k + 2)/2^k; in particular the sum is less than 2.", "src": "L4 slide 34", "formal": "∀k ≥ 0: Σ_{q=0}^{k} q/2^q = 2 − (k + 2)/2^k", "proof": "By induction on k. For k = 0 both sides are 0. For k ≥ 1: Σ_{q=0}^{k} q/2^q = (2 − (k + 1)/2^{k−1}) + k/2^k = 2 − (2k + 2 − k)/2^k = 2 − (k + 2)/2^k, using the induction hypothesis for k − 1. ∎", "sec": "Rooted trees and heaps", "lecs": [4]}, {"name": "topological-ordering-unpack", "type": "Definition", "needs": ["v₁,…,vₙ is a topological ordering of G"], "gives": ["v₁,…,vₙ lists every vertex of G exactly once, and (vᵢ,vⱼ) ∈ E(G) implies i < j"], "say": "Since v₁,…,vₙ is a topological ordering, every arc goes from an earlier vertex to a later one.", "src": "L4 slide 38", "formal": "v₁,…,vₙ topological ordering ⟹ V = {v₁,…,vₙ} ∧ ∀(vᵢ,vⱼ) ∈ E: i < j", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "topological-ordering-pack", "type": "Definition", "needs": ["v₁,…,vₙ lists every vertex of G exactly once, and (vᵢ,vⱼ) ∈ E(G) implies i < j"], "gives": ["v₁,…,vₙ is a topological ordering of G", "G has a topological ordering"], "say": "The ordering lists all vertices and every arc goes forward, hence it is a topological ordering of G.", "src": "L4 slide 38", "formal": "V = {v₁,…,vₙ} ∧ ∀(vᵢ,vⱼ) ∈ E: i < j ⟹ v₁,…,vₙ topological ordering", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "directed-cycle-unpack", "type": "Definition", "needs": ["G contains a directed cycle"], "gives": ["there are vertices c₁,…,cₖ (k ≥ 1) with (cᵢ,cᵢ₊₁) ∈ E(G) for i < k and (cₖ,c₁) ∈ E(G)"], "say": "Since G contains a directed cycle, there are vertices c₁,…,cₖ with arcs c₁ → c₂ → ⋯ → cₖ → c₁.", "src": "L4 slide 39", "formal": "G contains a directed cycle ⟹ ∃ distinct c₁,…,cₖ, k ≥ 1: (cᵢ,cᵢ₊₁) ∈ E for i < k, (cₖ,c₁) ∈ E", "proof": "This is the definition, read in this direction. For k = 1 the cycle is a loop (c₁,c₁).", "sec": "Topological ordering", "lecs": [4]}, {"name": "directed-cycle-pack", "type": "Definition", "needs": ["there are vertices c₁,…,cₖ (k ≥ 1) with (cᵢ,cᵢ₊₁) ∈ E(G) for i < k and (cₖ,c₁) ∈ E(G)"], "gives": ["G contains a directed cycle"], "say": "The arcs c₁ → c₂ → ⋯ → cₖ → c₁ form a directed cycle in G.", "src": "L4 slide 39", "formal": "∃ distinct c₁,…,cₖ, k ≥ 1: (cᵢ,cᵢ₊₁) ∈ E for i < k, (cₖ,c₁) ∈ E ⟹ G contains a directed cycle", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "dag-unpack", "type": "Definition", "needs": ["G is a DAG"], "gives": ["G is a directed graph", "G contains no directed cycle"], "say": "Since G is a DAG, G is a directed graph that contains no directed cycle.", "src": "L4 slide 40", "formal": "G DAG ⟹ G directed ∧ G contains no directed cycle", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "dag-pack", "type": "Definition", "needs": ["G is a directed graph", "G contains no directed cycle"], "gives": ["G is a DAG"], "say": "G is a directed graph with no directed cycle, hence G is a DAG.", "src": "L4 slide 40", "formal": "G directed ∧ G contains no directed cycle ⟹ G DAG", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "source-unpack", "type": "Definition", "needs": ["s is a source of G"], "gives": ["no arc of G ends in s"], "say": "Since s is a source, no arc ends in s.", "src": "L4 slide 41", "formal": "s source ⟹ ¬∃u: (u,s) ∈ E", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "source-pack", "type": "Definition", "needs": ["no arc of G ends in s"], "gives": ["s is a source of G", "G has a source"], "say": "No arc ends in s, hence s is a source.", "src": "L4 slide 41", "formal": "¬∃u: (u,s) ∈ E ⟹ s source", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "sink-unpack", "type": "Definition", "needs": ["t is a sink of G"], "gives": ["no arc of G starts in t"], "say": "Since t is a sink, no arc starts in t.", "src": "L4 slide 41", "formal": "t sink ⟹ ¬∃u: (t,u) ∈ E", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "sink-pack", "type": "Definition", "needs": ["no arc of G starts in t"], "gives": ["t is a sink of G", "G has a sink"], "say": "No arc starts in t, hence t is a sink.", "src": "L4 slide 41", "formal": "¬∃u: (t,u) ∈ E ⟹ t sink", "proof": "This is the definition, read in this direction.", "sec": "Topological ordering", "lecs": [4]}, {"name": "cycle-no-topological-ordering", "type": "Fact", "needs": ["there are vertices c₁,…,cₖ (k ≥ 1) with (cᵢ,cᵢ₊₁) ∈ E(G) for i < k and (cₖ,c₁) ∈ E(G)"], "gives": ["G has no topological ordering"], "say": "Along a directed cycle the positions in a topological ordering would have to increase all the way around, which is impossible.", "src": "L4 slide 39 (Observation)", "formal": "G contains a directed cycle ⟹ G has no topological ordering", "proof": "For the sake of contradiction, let v₁,…,vₙ be a topological ordering and let p(x) denote the position of x in it. For the cycle c₁,…,cₖ every arc goes forward, so p(c₁) < p(c₂) < ⋯ < p(cₖ) < p(c₁) — a contradiction (for k = 1: p(c₁) < p(c₁)). ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "topological-ordering-acyclic", "type": "Fact", "needs": ["G has a topological ordering"], "gives": ["G contains no directed cycle"], "say": "A graph with a topological ordering contains no directed cycle.", "src": "L4 slide 39 (Observation)", "formal": "G has a topological ordering ⟹ G contains no directed cycle", "proof": "This is the contrapositive of cycle-no-topological-ordering. ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "dag-source-sink", "type": "Fact", "needs": ["G contains no directed cycle"], "gives": ["G has a source", "G has a sink"], "say": "By the theorem on the existence of a source and a sink, every DAG has at least one source and at least one sink.", "src": "L4 slide 42", "formal": "G DAG ⟹ ∃ source ∧ ∃ sink", "proof": "Let P = (v₀,…,vₖ) be a longest directed path in G (it exists: V is finite and a single vertex is a path). We claim v₀ is a source. Suppose (w,v₀) ∈ E. If w = vᵢ for some i, then v₀ → v₁ → ⋯ → vᵢ → v₀ is a directed cycle — a contradiction. Otherwise (w,v₀,…,vₖ) is a longer directed path — a contradiction. Symmetrically, vₖ is a sink. ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "no-source-cycle", "type": "Fact", "needs": ["every vertex of G has an incoming arc"], "gives": ["G contains a directed cycle"], "say": "Every vertex has an incoming arc, so G has no source; a DAG always has one, hence G contains a directed cycle.", "src": "T3 Ex 7a", "formal": "(∀v ∃u: (u,v) ∈ E) ⟹ G contains a directed cycle", "proof": "For the sake of contradiction, suppose G contains no directed cycle. By dag-source-sink G has a source s, i.e. no arc ends in s. This contradicts the assumption that every vertex has an incoming arc. ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "mutual-paths-cycle", "type": "Fact", "needs": ["u ≠ v, and G has a directed path from u to v and a directed path from v to u"], "gives": ["G contains a directed cycle"], "say": "Going from u to v and back to u is a closed directed walk, and every closed directed walk contains a directed cycle.", "src": "T3 Ex 8a", "formal": "u ≠ v ∧ ∃ directed u-v-path ∧ ∃ directed v-u-path ⟹ G contains a directed cycle", "proof": "Joining the two paths gives a closed directed walk (w₀,w₁,…,wₘ = w₀) with m ≥ 2. Choose indices i < j with wᵢ = wⱼ and j − i as small as possible (they exist: w₀ = wₘ). Then wᵢ,…,wⱼ₋₁ are pairwise distinct, (wₜ,wₜ₊₁) ∈ E for i ≤ t < j, and wⱼ = wᵢ. By directed-cycle-pack these vertices form a directed cycle. ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "dag-has-topological-ordering", "type": "Fact", "needs": ["G contains no directed cycle"], "gives": ["G has a topological ordering"], "say": "Every DAG has a topological ordering: put a source first and order the rest by induction.", "src": "L4 slides 38–42 (proved with an algorithm in a later lecture)", "formal": "G contains no directed cycle ⟹ G has a topological ordering", "proof": "By induction on n. For n = 1 the single vertex is an ordering (there is no loop, since a loop is a directed cycle). Let n > 1. By dag-source-sink G has a source s. G − s contains no directed cycle (a cycle in it would be a cycle in G), so by the induction hypothesis it has a topological ordering v₂,…,vₙ. Put v₁ = s. An arc not touching s goes forward by the hypothesis; an arc (s,vⱼ) goes forward because s is first; no arc ends in s. So v₁,…,vₙ is a topological ordering of G. ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "hamiltonian-path-unique-ordering", "type": "Fact", "needs": ["G contains no directed cycle", "G has a directed path that goes through all vertices"], "gives": ["G has exactly one topological ordering"], "say": "The path through all vertices fixes the order of every two consecutive vertices, so only one topological ordering is possible.", "src": "T3 Ex 9 (⇐)", "formal": "G DAG with a directed path through all vertices ⟹ G has exactly one topological ordering", "proof": "Let (p₁,…,pₙ) be a directed path through all vertices. By dag-has-topological-ordering G has a topological ordering. In any topological ordering the arc (pᵢ,pᵢ₊₁) forces pᵢ before pᵢ₊₁, for every i. So the ordering must be p₁,…,pₙ: it is unique. ∎", "sec": "Topological ordering", "lecs": [4]}, {"name": "unique-ordering-hamiltonian-path", "type": "Fact", "needs": ["G has exactly one topological ordering"], "gives": ["G has a directed path that goes through all vertices"], "say": "If two neighbors in the ordering were not joined by an arc, swapping them would give a second topological ordering; so consecutive vertices are joined and the ordering itself is a path through all vertices.", "src": "T3 Ex 9 (⇒)", "formal": "G has exactly one topological ordering ⟹ G has a directed path through all vertices", "proof": "Let v₁,…,vₙ be the topological ordering. We claim (vᵢ,vᵢ₊₁) ∈ E for all i < n. Suppose not, for some i. Swap vᵢ and vᵢ₊₁. The only pair of vertices whose relative order changes is {vᵢ,vᵢ₊₁}; there is no arc (vᵢ,vᵢ₊₁) by assumption and no arc (vᵢ₊₁,vᵢ) because the original ordering is topological. So all arcs still go forward, and we get a second topological ordering — a contradiction. Hence (v₁,…,vₙ) is a directed path through all vertices. ∎", "sec": "Topological ordering", "lecs": [4]}]};

  FACTS=DATA.facts.filter(f=>prod[f].length||use[f].length)}
reindex();
const isGiven=f=>prod[f].length==0;
const lecTags=b=>b.lecs.map(l=>`<span class="tag" style="background:var(--mute)">Lecture ${l}</span>`).join("");
const key=o=>o.b?"b:"+o.b.name:"f:"+o.f;
const fromKey=k=>k[0]=="b"?{b:B[k.slice(2)]}:{f:k.slice(2)};
const label=o=>o.b?o.b.name:o.f;
let focus=null,depth=2,picked=null,mode="index";
const HINT={focus:"Click a node: proof along the path to the centre · Double-click: move the centre there · Drag / scroll: pan / zoom",
 over:"Click a starting fact, then nodes marked ▸: one step further each time · Click again: close · Double-click: focused view · Drag / scroll: pan / zoom"};
function show(m){mode=m;$("#index").classList.toggle("hide",m!="index");svg.classList.toggle("hide",m=="index");
 $("#hint").classList.toggle("hide",m=="index");$("#hint").textContent=HINT[m]||"";$("#depthbox").classList.toggle("hide",m!="focus")}

// ---------- tree building ----------
// backward: fact <- producing blocks <- their needs ...   forward: fact -> using blocks -> their gives ...
function build(o,dir,d,path){
  const t={o,dir,kids:[],more:false},p=new Set(path);p.add(key(o));
  let cand;
  if(o.f){cand=(dir<0?prod:use)[o.f].filter(b=>!p.has("b:"+b.name)&&!(dir<0?b.needs:b.gives).some(f=>p.has("f:"+f))).map(b=>({b}));
    if(d>=depth){t.more=cand.length>0;return t}}
  else cand=(dir<0?o.b.needs:o.b.gives).filter(f=>!p.has("f:"+f)).map(f=>({f}));
  t.kids=cand.map(c=>{const k=build(c,dir,d+(o.f?1:0),p);k.parent=t;return k});
  return t}
let slot;
function layY(t){if(!t.kids.length){t.y=slot++;return}t.kids.forEach(layY);t.y=(t.kids[0].y+t.kids[t.kids.length-1].y)/2}
function each(t,f,lv=0){f(t,lv);t.kids.forEach(k=>each(k,f,lv+1))}
const width=o=>Math.min(label(o).length,46)*(o.b?7.4:6.7)+22;
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};

function draw(){
  vp.innerHTML="";const ge=mk("g",{},vp),gn=mk("g",{},vp);
  const root={o:focus,kids:[],x:0,y:0,w:width(focus),isRoot:true};
  const all=[root],H=38,GAP=54;
  [-1,1].forEach(dir=>{
    const t=build(focus,dir,0,[]);slot=0;layY(t);const y0=t.y,colw=[];
    each(t,(n,lv)=>{n.lv=lv;n.w=width(n.o);colw[lv]=Math.max(colw[lv]||0,n.w)});
    const cx=[0];for(let i=1;i<colw.length;i++)cx[i]=cx[i-1]+colw[i-1]/2+GAP+colw[i]/2;
    cx[0]=0;if(colw.length>1)cx[1]=root.w/2+GAP+colw[1]/2;for(let i=2;i<colw.length;i++)cx[i]=cx[i-1]+colw[i-1]/2+GAP+colw[i]/2;
    each(t,n=>{n.x=dir*cx[n.lv];n.y=(n.y-y0)*H;if(n.lv>0)all.push(n)});
    t.kids.forEach(k=>k.parent=root);root["t"+dir]=t;
    each(t,n=>n.kids.forEach(k=>{const a=n.lv==0?root:n,s=dir<0?k:a,e=dir<0?a:k;
      const x1=s.x+s.w/2,x2=e.x-e.w/2-3,mx=(x1+x2)/2;k.edge=mk("path",{class:"edge","marker-end":"url(#ar)",d:`M${x1},${s.y}C${mx},${s.y} ${mx},${e.y} ${x2},${e.y}`},ge)}));
    if(colw.length>1){const ys=all.map(n=>n.y),top=Math.min(...ys)-34;
      mk("text",{class:"col",x:dir*cx[1],y:top},gn).textContent=dir<0?"← HOW TO GET HERE":"WHAT FOLLOWS →"}
  });
  all.forEach(n=>{const o=n.o,g=mk("g",{class:"node "+(o.b?"blk "+o.b.type:"fact"+(isGiven(o.f)?" given":""))+(n.isRoot?" root":""),transform:`translate(${n.x},${n.y})`},gn);
    mk("rect",{x:-n.w/2,y:-13,width:n.w,height:26,rx:o.b?13:4},g);
    mk("text",{},g).textContent=cut(label(o),46)+(n.more?"  ⋯":"");mk("title",{},g).textContent=label(o)+(n.more?"  (more behind — increase depth or double-click)":"");
    n.el=g;let timer=null;
    g.addEventListener("click",ev=>{ev.stopPropagation();if(moved)return;clearTimeout(timer);timer=setTimeout(()=>pick(n),190)});
    g.addEventListener("dblclick",ev=>{ev.stopPropagation();clearTimeout(timer);go(o)})});
  draw.all=all;draw.root=root;fit(all)}

function pathOf(n){const p=[];while(n&&!n.isRoot){p.push(n);n=n.parent}return p}
function pick(n){picked=n;draw.all.forEach(m=>{m.el.classList.remove("on");m.edge&&m.edge.classList.remove("on")});
  if(n.isRoot){card(focus);return}
  const p=pathOf(n);p.forEach(m=>{m.el.classList.add("on");m.edge.classList.add("on")});
  const seq=[...p.map(m=>m.o),focus];if(n.dir>0)seq.reverse();showPath(seq)}

// ---------- bird's-eye view: a menu of starting facts, opened one step at a time ----------
let OV=null;
function overview(){
  focus=null;show("over");markNav();
  const terms=new Set(),fsec={};
  BL.forEach(b=>{if(b.type=="Definition"&&/-unpack$/.test(b.name))b.needs.forEach(f=>terms.add(f));
    [...b.needs,...b.gives].forEach(f=>{if(!(f in fsec))fsec[f]=DATA.sections.indexOf(b.sec)})});
  const start=FACTS.filter(f=>use[f].length&&(isGiven(f)||terms.has(f))).sort((x,y)=>fsec[x]-fsec[y]||x.localeCompare(y)).map(f=>({o:{f},sec:fsec[f]}));
  // safety net: anything that cannot be reached from the menu gets its inputs added to the menu
  for(;;){const got=new Set(start.map(s=>s.o.f)),q=[...got];while(q.length){const f=q.pop();use[f].forEach(b=>b.gives.forEach(g=>{if(!got.has(g)){got.add(g);q.push(g)}}))}
    const miss=FACTS.filter(f=>use[f].length&&!got.has(f));if(!miss.length)break;start.push({o:{f:miss[0]},sec:fsec[miss[0]]})}
  start.sort((x,y)=>x.sec-y.sec||label(x.o).localeCompare(label(y.o)));
  OV={start,root:null,pick:null};renderOver();overHome()}
function kidsOf(t){const path=new Set();for(let p=t;p;p=p.parent)path.add(key(p.o));
  if(t.loop)return[];
  return t.o.f?use[t.o.f].filter(b=>!path.has("b:"+b.name)).map(b=>({o:{b}})):t.o.b.gives.map(f=>({o:{f},loop:path.has("f:"+f)}))}
function mkNode(o,parent,loop){const t={o,parent,kids:[],open:false,loop:!!loop};t.n=kidsOf(t).length;return t}
function setOpen(t,on){t.open=on;t.kids=on?kidsOf(t).map(k=>mkNode(k.o,t,k.loop)):[]}
function renderOver(){
  vp.innerHTML="";const ge=mk("g",{},vp),gn=mk("g",{},vp),{start,root}=OV,H=30,tw=(txt,blk)=>Math.min(txt.length,50)*(blk?7.4:6.7)+22;
  // column of starting facts, grouped by topic
  let y=0,sec=-1;const w0=Math.max(...start.map(s=>tw(label(s.o))));
  start.forEach(s=>{if(s.sec!=sec){sec=s.sec;y+=sec==start[0].sec?0:14;mk("text",{class:"col",x:0,y},gn).textContent=DATA.sections[sec].toUpperCase();y+=H-4}s.x=0;s.y=y;s.w=tw(label(s.o))+16;y+=H});
  const fitList=[];
  if(root){ // lay out the opened tree to the right of its starting fact
    let slot=0;const lay=t=>{if(!t.kids.length){t.sy=slot++;return}t.kids.forEach(lay);t.sy=(t.kids[0].sy+t.kids[t.kids.length-1].sy)/2};lay(root);
    const colw=[w0],all=[];const walk=(t,d)=>{t.d=d;t.txt=cut(label(t.o),46)+(t.o.b&&t.o.b.needs.length>1?"  +"+(t.o.b.needs.length-1):"")+(t.loop?"  ↺":t.n&&!t.open?"  ▸":"");t.w=tw(t.txt,!!t.o.b);
      if(d){colw[d]=Math.max(colw[d]||0,t.w);all.push(t)}t.kids.forEach(k=>walk(k,d+1))};walk(root,0);
    const cx=[0];for(let i=1;i<colw.length;i++)cx[i]=cx[i-1]+colw[i-1]/2+70+colw[i]/2;
    const s0=start.find(s=>s.o.f==root.o.f);root.x=0;root.y=s0.y;root.w=s0.w;
    all.forEach(t=>{t.x=cx[t.d];t.y=s0.y+(t.sy-root.sy)*H});
    const onPath=new Set();for(let p=OV.pick;p;p=p.parent)onPath.add(p);
    all.forEach(t=>{const p=t.parent,x1=p.x+p.w/2,x2=t.x-t.w/2-4,m=(x2-x1)/2;
      mk("path",{class:"edge"+(onPath.has(t)?" on":""),"marker-end":"url(#ar)",d:`M${x1},${p.y}C${x1+m},${p.y} ${x2-m},${t.y} ${x2},${t.y}`},ge);
      const o=t.o,g=mk("g",{class:"node "+(o.b?"blk "+o.b.type:"fact"+(isGiven(o.f)?" given":""))+(onPath.has(t)?" on":""),transform:`translate(${t.x},${t.y})`},gn);
      mk("rect",{x:-t.w/2,y:-12,width:t.w,height:24,rx:o.b?12:4},g);mk("text",{},g).textContent=t.txt;
      mk("title",{},g).textContent=label(o)+(t.loop?"\nYou already have this fact earlier on this path: the two are equivalent.":"")+(o.b&&o.b.needs.length>1?"\nAlso needs: "+o.b.needs.filter(f=>f!=p.o.f).join("; "):"");let timer=null;
      g.addEventListener("click",ev=>{ev.stopPropagation();if(moved)return;clearTimeout(timer);timer=setTimeout(()=>{
        if(t.n)setOpen(t,!t.open);OV.pick=t;renderOver();const seq=[];for(let p=t;p;p=p.parent)seq.unshift(p.o);picked={o:t.o};showPath(seq)},190)});
      g.addEventListener("dblclick",ev=>{ev.stopPropagation();clearTimeout(timer);go(o)})});
    fitList.push(root,...all)}
  start.forEach(s=>{const isRoot=root&&root.o.f==s.o.f,more=!(isRoot&&root.open),g=mk("g",{class:"node fact"+(isGiven(s.o.f)?" given":"")+(isRoot?" root":""),transform:`translate(0,${s.y})`},gn);
    mk("rect",{x:-s.w/2,y:-12,width:s.w,height:24,rx:4},g);mk("text",{},g).textContent=cut(label(s.o),50)+(more?"  ▸":"");mk("title",{},g).textContent=label(s.o);let timer=null;
    g.addEventListener("click",ev=>{ev.stopPropagation();if(moved)return;clearTimeout(timer);timer=setTimeout(()=>{
      if(isRoot)setOpen(root,!root.open);else{OV.root=mkNode(s.o,null);setOpen(OV.root,true)}
      OV.pick=null;renderOver();const r=OV.root;
      card(r.o,`<p><button id="open">Open focused view of this node</button></p><p class="mute">${r.open?`Opened: ${r.kids.length} block${r.kids.length==1?"":"s"} can use this fact. Click one to see what it gives.`:"Closed."}</p>`);$("#open").onclick=()=>go(r.o)},190)});
    g.addEventListener("dblclick",ev=>{ev.stopPropagation();clearTimeout(timer);go(s.o)})});
  OV.fit=fitList.length>1?fitList:start;fit(OV.fit)}
function overHome(){side.innerHTML=`<h1>Graph theory</h1><p class="mute">${OV.start.length} starting facts · ${FACTS.length} facts · ${BL.length} blocks</p>
  <p>The column lists the facts a statement can hand you, grouped by topic. Open the graph from one of them, <b>one step at a time</b>:</p>
  <ul><li>Click a <b>starting fact</b> → the blocks that can use it appear.</li><li>Click a <b>block</b> marked ▸ → the facts it gives appear.</li><li>Click one of those <b>facts</b> → the next blocks appear, and so on.</li>
  <li>Click an opened node again to close it. Click a different starting fact and the previous one closes.</li></ul>
  <h3>Reading it</h3><ul><li><b>Dashed green</b>: no block produces this fact; it can only be given. <b>Solid</b>: a defined term such as “G is a tree”, usually given but also provable.</li>
  <li><b>↺</b> after a fact: you already had it earlier on this path, so the two facts are equivalent.</li><li><b>+1, +2</b> after a block name: the block needs that many more facts besides the one you came from. Its card lists them.</li>
  <li>The side panel shows the <b>formal proof along the path</b> from the starting fact to the node you clicked.</li></ul>
  <p style="margin-top:8px">Double-click any node for its focused view (everything that leads to it and from it), or pick a block from the lists on the left.</p>`}

// ---------- pan / zoom ----------
let T={x:0,y:0,k:1},pan=null,moved=false;
const apply=()=>vp.setAttribute("transform",`translate(${T.x},${T.y}) scale(${T.k})`);
function fit(list){let a=1e9,b=1e9,c=-1e9,d=-1e9;list.forEach(n=>{a=Math.min(a,n.x-n.w/2);b=Math.min(b,n.y-50);c=Math.max(c,n.x+n.w/2);d=Math.max(d,n.y+30)});
  const r=svg.getBoundingClientRect(),k=Math.min(1.25,r.width/(c-a+60),(r.height-44)/(d-b+60));if(!r.width)return;T={k,x:r.width/2-k*(a+c)/2,y:(r.height-44)/2-k*(b+d)/2};apply()}
svg.addEventListener("pointerdown",ev=>{pan={x:ev.clientX-T.x,y:ev.clientY-T.y,sx:ev.clientX,sy:ev.clientY};moved=false});
addEventListener("pointermove",ev=>{if(pan){if(Math.abs(ev.clientX-pan.sx)+Math.abs(ev.clientY-pan.sy)>4)moved=true;if(moved){T.x=ev.clientX-pan.x;T.y=ev.clientY-pan.y;apply()}}});
addEventListener("pointerup",()=>{pan=null});
svg.addEventListener("wheel",ev=>{ev.preventDefault();const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top,k=Math.max(.2,Math.min(3,T.k*Math.exp(-ev.deltaY*.0015)));
  T.x=mx-(mx-T.x)*k/T.k;T.y=my-(my-T.y)*k/T.k;T.k=k;apply()},{passive:false});

// ---------- side panel ----------
const lk=o=>`<a class="lk${o.b?" mono":""}" data-k="${esc(key(o))}">${esc(label(o))}</a>`;
const blockBody=b=>`<div class="formal">${esc(b.formal)}</div>
  <h3>Needs</h3><ul>${b.needs.map(f=>"<li>"+lk({f})+"</li>").join("")}</ul>
  <h3>Gives</h3><ul>${b.gives.map(f=>"<li>"+lk({f})+"</li>").join("")}</ul>
  <h3>Proof</h3><p class="proof">${esc(b.proof)}</p>
  <h3>Say in your proof</h3><p class="say">“${esc(b.say)}”</p>
  <p class="mute">Source: ${esc(b.src)}</p>`;
function card(o,extra){
  if(o.b){const b=o.b;side.innerHTML=`<span class="tag" style="background:var(--${b.type=="Fact"?"fac":"def"})">${b.type} block</span>${lecTags(b)}<h2 class="mono">${esc(b.name)}</h2>`+blockBody(b)}
  else{const f=o.f,pr=prod[f],us=use[f];
   side.innerHTML=`<span class="tag" style="background:var(--factb)">Fact</span>${isGiven(f)?'<span class="tag" style="background:var(--given)">given only</span>':""}<h2>${esc(f)}</h2>
   <h3>How to get this fact (${pr.length})</h3>${pr.length?pr.map(b=>`<details><summary>${lk({b})} <span class="mute">from: ${esc(b.needs.join("; "))}</span></summary><div class="formal">${esc(b.formal)}</div><p class="proof">${esc(b.proof)}</p></details>`).join(""):'<p class="mute">No block produces it. It must be given in the statement (or assumed, e.g. for a contradiction).</p>'}
   <h3>What you can do with it (${us.length})</h3>${us.length?"<ul>"+us.map(b=>`<li>${lk({b})} <span class="mute">→ ${esc(b.gives.join("; "))}</span></li>`).join("")+"</ul>":'<p class="mute">Nothing further in the selected lectures: an end point.</p>'}`}
  side.insertAdjacentHTML("beforeend",extra||'<p class="mute" style="margin-top:14px">Click another node in the picture to see the proof along the path between it and this node.</p>');bind()}
function showPath(seq){ // seq alternates facts/blocks in arrow direction
  const blocks=seq.filter(o=>o.b),a=seq[0],z=seq[seq.length-1];let i=0;
  let h=`<span class="tag" style="background:var(--hl);color:#000">Path</span><h2>${esc(cut(label(a),60))} &nbsp;⟶&nbsp; ${esc(cut(label(z),60))}</h2>
   <p class="mute">${blocks.length} block${blocks.length==1?"":"s"} along this path. Each step is a claim with its proof.</p>`;
  seq.forEach((o,j)=>{if(!o.b)return;const b=o.b,inF=seq[j-1]&&seq[j-1].f,outF=seq[j+1]&&seq[j+1].f,extra=b.needs.filter(f=>f!==inF);
   h+=`<div class="step"><div class="hd"><span class="num">${++i}</span>${lk(o)}<span class="mute">${b.type} · L${b.lecs.join(", L")}</span></div>
    ${inF?`<p><b>From:</b> ${esc(inF)}</p>`:""}${extra.length?`<p><b>${inF?"Also needs":"Needs"}:</b> ${extra.map(f=>lk({f})).join("; ")}</p>`:""}
    <p><b>Claim.</b></p><div class="formal">${esc(b.formal)}</div>
    <p class="proof"><b>Proof.</b> ${esc(b.proof)}</p>
    ${outF?`<p><b>Therefore:</b> ${esc(outF)}</p>`:`<p><b>Gives:</b> ${esc(b.gives.join("; "))}</p>`}</div>`});
  h+=`<h3>Written as one proof</h3><p class="say">${blocks.map(o=>esc(o.b.say)).join(" ")} ∎</p>`;
  const side2=blocks.flatMap((o,j)=>{const inF=seq[seq.indexOf(o)-1];return o.b.needs.filter(f=>!inF||f!==inF.f)});
  if(side2.length)h+=`<p class="mute">This path alone is not a complete proof: the “also needs” facts must be given or derived too (click them).</p>`;
  h+=`<p><button id="mv">Open focused view of: ${esc(cut(label(picked.o),34))}</button></p>`;
  side.innerHTML=h;bind();$("#mv").onclick=()=>go(picked.o)}
function bind(){side.querySelectorAll("a.lk").forEach(a=>a.onclick=ev=>{ev.preventDefault();go(fromKey(a.dataset.k))})}

// ---------- index / navigation ----------
function go(o){focus=o;picked=null;show("focus");markNav();draw();card(o)}
// ---------- sidebar ----------
function markNav(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("cur",mode=="over"?b.id=="navstart":!!focus&&!!focus.b&&b.dataset.k=="b:"+focus.b.name))}
(()=>{const list=type=>{const bs=BL.filter(b=>b.type==type);
    return `<details><summary><b><i class="dot" style="background:var(--${type=="Fact"?"fac":"def"})"></i>${type} blocks</b><span>${bs.length}</span></summary>`+
      DATA.sections.map(sec=>{const x=bs.filter(b=>b.sec==sec);return x.length?`<h4>${esc(sec)}</h4>`+x.map(b=>`<button class="blk" data-k="b:${esc(b.name)}" title="${esc(b.formal)}">${esc(b.name)}</button>`).join(""):""}).join("")+`</details>`};
  $("#nav").innerHTML=`<h3>Explore</h3><button id="navstart">Starting facts</button><h3>Blocks</h3>`+list("Definition")+list("Fact");
  $("#navstart").onclick=overview;$("#nav").querySelectorAll("button.blk").forEach(b=>b.onclick=()=>go(fromKey(b.dataset.k)))})();
const setD=d=>{depth=Math.max(1,Math.min(5,d));$("#dv").textContent=depth;$("#dm").disabled=depth==1;$("#dp").disabled=depth==5;if(focus){draw();card(focus)}};
$("#dm").onclick=()=>setD(depth-1);$("#dp").onclick=()=>setD(depth+1);
addEventListener("resize",()=>{if(mode=="focus")fit(draw.all);if(mode=="over")fit(OV.fit)});
overview();
</script></body></html>
