  <ul><li><b>Worst case:</b> the pivot is always the largest element and k = 1: Θ(n) + Θ(n − 1) + ⋯ + Θ(1) = Θ(n²). Try “largest element”.</li><li><b>Best case:</b> the pivot is a median: Θ(n) + Θ(n/2) + ⋯ = Θ(n).</li><li><b>Almost median</b> (in the middle two quarters of the sorted order): each side has at most 3n/4 elements, so Θ(n) + Θ(3n/4) + Θ((3/4)²n) + ⋯ = Θ(n).</li></ul>
  <p><b>Waiting for an event.</b> If an event has probability p, the expected number of attempts until it happens is 1/p (proved in BIE-PST). At least half of the elements are almost medians, so a random pick is one with probability ≥ 1/2 and the expected number of tries is ≤ 2.</p>
  <p><b>Theorem.</b> RandomQuickSelect runs in Θ(n) on average. <i>Proof.</i> Phase i (one recursion level) has at most (3/4)^{i−1}·n elements, because each phase throws away at least a quarter. Let Tᵢ be the steps of phase i: E[Tᵢ] ≤ (3/4)^{i−1}·O(n)·2 (two expected tries, each linear). With T = T₁ + ⋯ + T_ℓ, ℓ = O(log n), linearity of expectation gives E[T] = Σ E[Tᵢ] ≤ Σ (3/4)^{i−1}·O(n) = O(n). ∎</p>
  <p class="own">On this page an almost median means |L| ≤ 3n/4 and |R| ≤ 3n/4, which is exactly what the proof uses.</p>`},
 {id:"hanoi",title:"Towers of Hanoi",lec:"L8 (Tutorial 8)",sub:"A classic recursion: to move n discs, move n − 1 out of the way, move the largest, and move the n − 1 back on top.",code:HAC.code,ids:HAC.ids,head:[0],draw:drawHanoi,
  setup(inp){inp.innerHTML=`<label>Discs n <select id="hn">${[1,2,3,4,5,6].map(n=>`<option${n==3?" selected":""}>${n}</option>`).join("")}</select></label>`;const go=()=>runS(hanoiSteps(+$("#hn").value));$("#hn").onchange=go;go()},
  notes:tags({Moves:"2ⁿ − 1"})+`<p><b>Claim</b> (Tutorial 8, Ex. 1). Hanoi performs exactly 2ⁿ − 1 moves.</p>
  <p><b>Proof</b> by induction on n. For n = 1 there is 1 = 2¹ − 1 move. For n &gt; 1 the algorithm makes two calls with n − 1 discs and one move, so T(n) = 2T(n − 1) + 1 = 2(2ⁿ⁻¹ − 1) + 1 = 2ⁿ − 1 by the induction hypothesis. ∎</p>
  <p><b>Correctness.</b> During Hanoi(n − 1; A, C, B) disc n stays at the bottom of A and every other disc is smaller, so it never blocks a move; then disc n goes to the empty peg B, and the n − 1 smaller discs are put on top of it.</p>
  <p class="own">From Tutorial 8; the proof is mine.</p>`},
 {id:"verifymm",title:"VerifyMM: checking a matrix product",lec:"L8",sub:"Check C = A·B in O(n²) with a random 0/1 vector. If the answer is “C ≠ A·B”, it is certainly right; a wrong C slips through with probability at most 1/2.",code:["VerifyMM(A, B, C):","(1)  select a random vector x ∈ {0, 1}ⁿ","(2)  y = A · (B · x)","(3)  z = C · x","(4)  if z == y:","(5)      return “C = A · B”","(6)  return “C ≠ A · B”"],ids:[null,"v1","v2","v3","v4","v5","v6"],head:[0],draw:drawVM,
  setup(inp){inp.innerHTML=`<label>C is <select id="vw"><option value="1">wrong in one entry</option><option value="0">the correct product</option></select></label><button class="b" id="vnew">New matrices</button><button class="b pri" id="vrun">Run VerifyMM</button><button class="b" id="v50">Run 50 times</button><button class="b" id="vshow">Show the error</button>`;
    const idle=m=>runS([{ln:[],msg:m}]);const nw=()=>{vmNew(4,$("#vw").value=="1");idle(VM.bad?"C differs from A·B in one entry (hidden). Run VerifyMM and see how often it notices.":"C is exactly A·B. Every run must answer “C = A · B”.")};
    $("#vw").onchange=nw;$("#vnew").onclick=nw;$("#vrun").onclick=()=>runS(vmRun(false));$("#vshow").onclick=()=>{VM.show=!VM.show;show()};
    $("#v50").onclick=()=>{const s0=VM.said;for(let i=0;i<50;i++)vmRun(true);idle(`50 more runs: ${VM.said-s0} of them answered “C ≠ A·B”.${VM.bad?" A wrong C survives all 50 runs with probability at most (1/2)⁵⁰.":""}`)};nw()},
  notes:tags({Time:"O(n²)","Error (C ≠ AB)":"≤ 1/2 per run"})+`<p><b>Theorem.</b> VerifyMM runs in O(n²). If C = A·B it answers “C = A·B”. If C ≠ A·B it answers “C ≠ A·B” with probability at least 1/2.</p>
  <p><b>Proof.</b> Three matrix–vector products cost O(n²). If C = AB then Cx = A(Bx) for every x. Otherwise D = C − AB is not zero; take an entry d_{ij} ≠ 0 and let y = Dx. Then yᵢ = d_{ij}xⱼ + S, where S depends only on the other coordinates. Choose the coordinates of x one by one, xⱼ last: S is already fixed, and yᵢ is either S (xⱼ = 0) or S + d_{ij} (xⱼ = 1), each with probability 1/2. At least one of these is non-zero, so P[Dx ≠ 0] ≥ 1/2. ∎</p>
  <p><b>Amplification.</b> Run it 50 times: if all runs answer “C = A·B”, then P[C ≠ AB] ≤ (1/2)⁵⁰ &lt; 10⁻¹⁵, still in O(n²).</p>
  <p><b>Expected waiting.</b> An event with probability p needs 1/p attempts on average; for a wrong C at most 1/(1/2) = 2 runs until it is caught.</p>
  <p>Multiplying is much slower: the school method takes O(n³), Strassen O(n^2.807) (see Strassen).</p>`},
 {id:"quick",title:"QuickSort",lec:"L9",sub:"Split around a pivot into L (smaller), M (equal) and R (larger); M is already in place, so sort L and R recursively and join them.",code:QKC.code,ids:QKC.ids,head:[0],draw:drawQSort,
  setup(inp){inp.innerHTML=`<label>Input <input type="text" id="arr" value="7, 4, 6, 2, 1, 9, 1, 5, 3" style="width:220px"></label><label>Pivot <select id="qp"><option value="random">random (lecture’s analysis)</option><option value="middle">middle position</option><option value="first">first element</option></select></label><button class="b" id="apply">Run</button><button class="b" id="rnd">Random</button><button class="b" id="adv">Bad input for “middle” (Prerequisite 9)</button><button class="b" id="qexp">Measure averages</button>`;
    const go=()=>{const a=parseArr($("#arr").value).slice(0,16);if(!a.length)return;$("#arr").value=a.join(", ");runS(qsortSteps(a,$("#qp").value))};
    $("#apply").onclick=go;$("#qp").onchange=()=>{QX=null;go()};$("#rnd").onclick=()=>{$("#arr").value=Array.from({length:10},()=>1+rndI(30)).join(", ");go()};
    $("#adv").onclick=()=>{$("#qp").value="middle";$("#arr").value=advMiddle(9).join(", ");go()};$("#qexp").onclick=()=>{qsExp($("#qp").value);show()};QX=null;go()},
  notes:tags({"Expected (random pivot)":"O(n log n)","Worst case":"Θ(n²)",Memory:"O(n) as written"})+`<p><b>Recursion tree.</b> Every level of the tree holds at most n elements together, and splitting and joining are linear, so each level costs O(n). With a median or almost-median pivot the parts shrink by a factor 3/4, so there are O(log n) levels: O(n log n). With a bad pivot (one part of size 1 every time) there are Θ(n) levels: Θ(n²). Try “Bad input for middle”.</p>
  <p><b>Observation.</b> QuickSort compares every pair at most once (only with the pivot, which then leaves the recursion), with O(1) extra work per comparison. So it is enough to count comparisons.</p>
  <p><b>Indicators.</b> A random variable with values 0 or 1 is an indicator; E[X] = P[X = 1]. <b>Harmonic numbers:</b> Hₙ = 1 + 1/2 + ⋯ + 1/n, and 1/n + ln n ≤ Hₙ ≤ 1 + ln n, so Hₙ = Θ(log n).</p>
  <p><b>Theorem.</b> With the pivot chosen uniformly at random, QuickSort makes O(n log n) comparisons in expectation.</p>
  <p><b>Lemma.</b> Let y₁ &lt; ⋯ &lt; yₙ be the sorted output and Cᵢⱼ the indicator that yᵢ and yⱼ are compared (i &lt; j). Then E[Cᵢⱼ] = 2/(j − i + 1). <i>Proof:</i> they are compared only if one of them is the pivot at that moment, and only if no element among yᵢ₊₁, …, yⱼ₋₁ was a pivot before (it would separate them into L and R). So Cᵢⱼ = 1 exactly when the first pivot chosen among yᵢ, …, yⱼ is yᵢ or yⱼ. Each of these j − i + 1 elements is equally likely to be first: probability 2/(j − i + 1).</p>
  <p><b>Proof of the theorem.</b> C = Σ_{i&lt;j} Cᵢⱼ, so by linearity E[C] = Σ_{i&lt;j} 2/(j − i + 1). With d = j − i: E[C] = 2 Σ_{d=1}^{n−1} Σ_{i=1}^{n−d} 1/(d + 1) &lt; 2(n − 1) Σ_{d=1}^{n−1} 1/(d + 1) &lt; 2n Σ_{d′=2}^{n} 1/d′ &lt; 2n·Hₙ = O(n log n). ∎</p>
  <p><b>Average-case complexity.</b> A fixed pivot rule (for example the middle position) can be attacked by an adversary: Prerequisite 9 builds the input 6, 4, 2, 1, 3, 5, 7 by placing ever larger elements alternately left and right of the middle, so the middle is always the minimum. But if the input is a uniformly random permutation, the middle element is a random element, and the parts are again random permutations: the expected time is again O(n log n) (Yao’s principle). “Measure averages” runs this.</p>
  <p class="own">The exact expectation 2(n + 1)Hₙ − 4n in the table is a standard formula, not from the lecture. Tutorial 9: QuickSort as written is not in place; with in-place partitioning it needs O(1) extra memory apart from the recursion (Ex. 4).</p>`},
 {id:"lower",title:"Sorting lower bound: decision trees",lec:"L9",static:true,sub:"Every comparison sort is a decision tree: one comparison per inner vertex, one sorted order per leaf. n! leaves force depth ≥ log₂ n!, i.e. Ω(n log n) comparisons.",code:[],
  setup(inp){param={alg:"lec",n:3,pi:0};inp.innerHTML=`<label>Algorithm <select id="dta"><option value="lec">lecture’s tree (n = 3)</option><option value="insert">InsertSort</option><option value="merge">MergeSort</option><option value="select">SelectSort</option></select></label><label>n <select id="dtn"><option>3</option><option>4</option></select></label><label>Input (a₁, …, aₙ) <select id="dtp"></select></label>`;
    const fill=()=>{$("#dtp").innerHTML=perms(param.n).map((p,i)=>`<option value="${i}">(${p.join(", ")})</option>`).join("");$("#dtp").value=param.pi=Math.min(param.pi,perms(param.n).length-1)};
    $("#dta").onchange=e=>{param.alg=e.target.value;if(param.alg=="lec"){param.n=3;$("#dtn").value="3"}fill();drawDT()};$("#dtn").onchange=e=>{param.n=+e.target.value;if(param.alg=="lec"&&param.n!=3){param.alg="insert";$("#dta").value="insert"}fill();drawDT()};
    $("#dtp").onchange=e=>{param.pi=+e.target.value;drawDT()};fill();drawDT()},
  notes:`<p><b>Lower bound of a problem.</b> No algorithm can be asymptotically faster than it; an algorithm that matches it is optimal. A lower bound is a property of the problem, not of an algorithm.</p>
  <p><b>Compare–exchange model.</b> The input elements may only be compared (ai &lt; aj, =, &gt;; constant time) and exchanged, and the algorithm is deterministic.</p>
  <p><b>Theorem (searching).</b> For every deterministic search in a sorted sequence there is an x that needs Ω(log n) comparisons, so binary search is optimal. <i>Proof:</i> the run is a decision tree: each vertex is a comparison x &lt; aᵢ with three children (&lt;, =, &gt;; impossible ones omitted), each leaf an answer. Different positions need different leaves, so there are at least n leaves; a ternary tree of depth d has at most 3ᵈ leaves, so the depth is at least log₃ n.</p>
  <p><b>Theorem (sorting).</b> For every deterministic comparison sort there is an input of size n that needs Ω(n log n) comparisons. <i>Proof:</i> take the inputs to be the permutations of {1, …, n}. Change the algorithm to do all comparisons first and all exchanges at the end (keep track of positions). Its runs form a binary decision tree (no equality in a permutation). Two different permutations cannot be sorted by the same exchanges, so they end in different leaves: at least n! leaves, depth at least log₂ n!. Since n! ≥ e·(n/e)ⁿ, log₂ n! ≥ 1 + n(log n − 1) = Ω(n log n). ∎ The picture shows this tree; pick an input to see its path.</p>
  <p><b>Corollary.</b> ExtractMin on a binary heap needs Ω(log n) in the worst case. <i>Proof:</i> if it took o(log n), then HeapBuild (O(n)) plus n ExtractMins would sort in o(n log n), contradicting the theorem. The same argument works for BSTInsert (Tutorial 9, Ex. 9: insert all, then read them in order with BSTShow).</p>
  <p class="own">The InsertSort, MergeSort and SelectSort trees are generated by running the algorithm on all n! inputs. SelectSort makes redundant comparisons, so its tree is deeper than necessary.</p>`},
 {id:"counting",title:"CountingSort",lec:"L9",sub:"Sorts n numbers from {1, …, r} in Θ(n + r) without comparing them: count each value, compute where each value starts, then place the elements.",code:CSC.code,ids:CSC.ids,head:[0],draw:drawCS,
  setup(inp){inp.innerHTML=`<label>Input <input type="text" id="arr" value="5, 6, 1, 4, 7, 6, 4, 6, 2" style="width:200px"></label><label>r <input type="number" id="cr" value="7" min="1" max="20" style="width:60px"></label><button class="b" id="apply">Run</button><button class="b" id="rnd">Random</button>`;
    const go=()=>{const r=Math.max(1,Math.min(20,Math.round(+$("#cr").value)||1));let a=parseArr($("#arr").value).filter(v=>v>=1&&v<=r).slice(0,14);if(!a.length)return;$("#arr").value=a.join(", ");runS(csSteps(a,r))};
    $("#apply").onclick=go;$("#rnd").onclick=()=>{$("#cr").value=6;$("#arr").value=Array.from({length:10},()=>1+rndI(6)).join(", ");go()};go()},
  notes:tags({Time:"Θ(n + r)",Memory:"Θ(n + r)",Stable:"yes","In-place":"no","Data-sensitive":"no"})+`<p><b>Why it beats Ω(n log n).</b> It is not a comparison sort: it uses the values as array indices. The special property it needs is the small range {1, …, r}; for r = O(n) it runs in linear time.</p>
  <ul><li>count[j] = how many times j occurs.</li><li>start[j] = 1 + (number of elements smaller than j) = where the first j goes in the output.</li><li>Going through the input from left to right and moving start[xᵢ] forward keeps equal keys in their input order: CountingSort is <b>stable</b>, which LexCountingSort relies on.</li></ul>
  <p class="own">Tutorial 9, Ex. 6 (numbers from 0 to n³ − 1): write them in base n with 3 digits and use LexCountingSort: Θ(3(n + n)) = Θ(n). My answer.</p>`},
 {id:"lex",title:"LexCountingSort and RadixSort",lec:"L9",sub:"Sort k-tuples (or k-digit numbers) by running a stable CountingSort on the last coordinate, then the one before it, and so on up to the first.",code:LXC.code,ids:LXC.ids,head:[0],draw:drawLex,
  setup(inp){param={radix:false};inp.innerHTML=`<label>Data <select id="lxm"><option value="t">lecture example: 4-tuples over {1, 2, 3}</option><option value="r">numbers (RadixSort, base 10)</option></select></label><label>Numbers <input type="text" id="arr" value="329, 457, 657, 839, 436, 720, 355" style="width:240px"></label><button class="b" id="apply">Run</button><button class="b" id="rnd">Random numbers</button>`;
    const EX=[[3,2,1,2],[2,1,3,3],[3,3,2,2],[1,2,3,1],[1,1,3,2],[2,3,1,3],[2,2,2,2],[3,2,3,2],[2,1,1,2]];
    const go=()=>{param.radix=$("#lxm").value=="r";if(!param.radix)return runS(lexSteps(EX,4));const a=parseArr($("#arr").value).map(Math.abs).slice(0,12);if(!a.length)return;const k=Math.max(...a.map(v=>String(v).length));runS(lexSteps(a.map(v=>String(v).padStart(k,"0").split("").map(Number)),k))};
    $("#lxm").onchange=go;$("#apply").onclick=()=>{$("#lxm").value="r";go()};$("#rnd").onclick=()=>{$("#lxm").value="r";$("#arr").value=Array.from({length:8},()=>rndI(1000)).join(", ");go()};go()},
  notes:tags({Time:"Θ(k(n + r))",Memory:"Θ(kn + r)",Stable:"yes"})+`<p><b>Idea.</b> Sort by the least important coordinate first. Because every pass is stable, ties in the current coordinate keep the order created by the earlier passes.</p>
  <p><b>Theorem.</b> LexCountingSort sorts the k-tuples lexicographically and is stable. <i>Proof</i> by induction on i: after the i-th iteration, the tuples are sorted by the coordinates k − i + 1, …, k. Base: after the first iteration they are sorted by the last coordinate. Step: the i-th iteration places first the tuples with 1 at coordinate k − i + 1, then those with 2, and so on; inside each group the order from the previous iterations is kept (stability), and that order was correct on coordinates k − i + 2, …, k by the induction hypothesis. So after the i-th iteration they are sorted on k − i + 1, …, k. ∎</p>
  <p><b>Time.</b> Θ(k · (n + r)): linear in the input length k·n when k and r are constants. <b>RadixSort</b> (Tutorial 9, Ex. 5) is this with the digits of numbers as coordinates (r = 10).</p>
  <p class="own">Prerequisite 9, Ex. 3: a deck of cards is a list of pairs (value, colour): two CountingSort passes, first by value, then by colour.</p>`},
 {id:"fib",title:"Fibonacci: recursion, memoization, iteration",lec:"L10",sub:"The same problem three ways. Plain recursion solves the same subproblems again and again; a table removes the repetition.",code:FBC.rec.code,ids:FBC.rec.ids,head:[0],draw:drawFib,
  setup(inp){inp.innerHTML=`<label>n <select id="fn">${[1,2,3,4,5,6,7,8].map(k=>`<option${k==6?" selected":""}>${k}</option>`).join("")}</select></label><label>Method <select id="fm"><option value="rec">FibRec: plain recursion</option><option value="mem">FibMem: memoization</option><option value="iter">FibIter: table, bottom-up</option></select></label>`;
    const go=()=>runS(fibSteps(+$("#fn").value,$("#fm").value));$("#fn").onchange=go;$("#fm").onchange=go;go()},
  notes:tags({FibRec:"Θ(Φⁿ)",FibMem:"O(n)",FibIter:"O(n)"})+`<p><b>Dynamic programming</b> also decomposes a problem recursively, but it uses the fact that the <b>same subproblems repeat</b>. Divide and conquer would solve them again and again; DP solves each once and stores the answer.</p>
  <p><b>Claim.</b> FibRec(n) takes Θ(F(n)) = Θ(Φⁿ⁺¹) time, Φ ≈ 1.618. <i>Proof:</i> every vertex of the recursion tree is a leaf or has exactly two children, so there are at most as many inner vertices as leaves. Each inner vertex returns the sum of the leaves below it, and each leaf returns 1, so the tree has exactly F(n) leaves.</p>
  <p><b>Memoization.</b> Keep a table T, initially undefined. Before recursing, look the value up; after computing it, store it. <b>Claim:</b> FibMem(n) runs in O(n): a call recurses only if T[k] is undefined, which happens at most n times, so the tree has at most n − 1 inner vertices and n leaves, each O(1).</p>
  <p><b>Iteration.</b> Fill the table from the smallest values up: no recursion at all, still O(n).</p>
  <p><b>The DP recipe.</b> (1) Write the solution recursively using subproblems. (2) Notice that subproblems repeat. (3) Store solutions in a table, starting with the trivial ones; look before you compute (top-down, memoization). (4) Better still, find an order that fills the table bottom-up without recursion.</p>
  <p class="own">Tutorial 10, Ex. 1: tilings of a 2 × n corridor with 1 × 2 tiles satisfy t(n) = t(n − 1) + t(n − 2): Fibonacci again. With 2 × 2 tiles added, t(n) = t(n − 1) + 2t(n − 2). My answer.</p>`},
 {id:"lis",title:"Longest increasing subsequence",lec:"L10",sub:"T[i] = length of the longest increasing subsequence starting with xᵢ, filled from the right. P[i] remembers the next element so the subsequence itself can be read off.",code:LISC.code,ids:LISC.ids,head:[0],draw:drawLIS,
  setup(inp){param={graph:true};inp.innerHTML=`<label>Sequence <input type="text" id="arr" value="5, 6, 2, 4, 13, 8, 11, 3" style="width:240px"></label><button class="b" id="apply">Run</button><button class="b" id="pre">Prerequisite 10 input</button><button class="b" id="rnd">Random</button><label><input type="checkbox" id="lg" checked> show the graph model</label>`;
    const go=()=>{const a=parseArr($("#arr").value).slice(0,12);if(!a.length)return;$("#arr").value=a.join(", ");runS(lisSteps(a))};$("#apply").onclick=go;
    $("#pre").onclick=()=>{$("#arr").value="10, 8, 6, 4, 8, 1, -5, 12";go()};$("#rnd").onclick=()=>{$("#arr").value=Array.from({length:9},()=>1+rndI(20)).join(", ");go()};$("#lg").onchange=e=>{param.graph=e.target.checked;show()};go()},
  notes:tags({Recursive:"exponential",Memoized:"O(n²)",Iterative:"O(n²)","Best known":"O(n log n)"})+`<p><b>Problem.</b> Given x₁, …, xₙ, find the longest subsequence xᵢ₁ &lt; ⋯ &lt; xᵢₖ with i₁ &lt; ⋯ &lt; iₖ (equivalently, delete as few elements as possible to leave an increasing sequence).</p>
  <p><b>Recursive idea.</b> If 5, 6, 8, 11 is a LIS, then 6, 8, 11 is a LIS of the part starting at 6: a longer one would give a longer one from 5. So the LIS starting at xᵢ is xᵢ followed by the best LIS starting at some xⱼ with j &gt; i and xⱼ &gt; xᵢ. Adding x₀ = −∞ gives a single starting point; the answer is T[0] − 1.</p>
  <p><b>Memoization</b> calls LengthLISRec for only n + 1 arguments, each doing O(n) work: O(n²). The iterative version fills T from i = n down to 0.</p>
  <p><b>Claim.</b> LengthLISIter is correct. <i>Proof</i> by reverse induction on i: if the optimal solution for xᵢ, …, xₙ starts with xᵢ, xⱼ, then without xᵢ it is an optimal solution starting with xⱼ for xⱼ, …, xₙ; otherwise a better one for xⱼ, …, xₙ extended by xᵢ would beat it.</p>
  <p><b>Finding the subsequence.</b> P[i] stores the index of the second element of the best subsequence starting at xᵢ; the LIS is x at P[0], P[P[0]], …. When P[j] = ⊥, xⱼ is the last element.</p>
  <p><b>Graph model.</b> Vertices x₀ = −∞, x₁, …, xₙ, xₙ₊₁ = +∞; an arc (xᵢ, xⱼ) whenever i &lt; j and xᵢ &lt; xⱼ. Increasing subsequences are directed paths, and the LIS is a longest path from x₀ to xₙ₊₁. The graph is a DAG with topological ordering x₀, …, xₙ₊₁, and the longest path is found by going through it backwards, exactly like LISIter. Many DP problems are longest/shortest paths in a suitable DAG.</p>
  <p class="own">Prerequisite 10 also asks for subsequences with one allowed decrease: keep a second table T₁[i] (best with one decrease used) with T₁[i] = 1 + max over j &gt; i of T₁[j] (if xᵢ &lt; xⱼ) or T[j] (if xᵢ ≥ xⱼ). Not interactive here.</p>`},
 {id:"edit",title:"Edit distance",lec:"L10",sub:"The fewest insertions, deletions and changes of single characters that turn x into y. T[i, j] is the distance between the suffixes starting at xᵢ and yⱼ.",code:EDC.code,ids:EDC.ids,head:[0],draw:drawEdit,
  setup(inp){inp.innerHTML=`<label>x <input type="text" id="ex" value="abba" style="width:120px"></label><label>y <input type="text" id="ey" value="cba" style="width:120px"></label><button class="b pri" id="ego">Compute</button><button class="b" id="eex">Example: kitten → sitting</button>`;
    const go=()=>{const x=$("#ex").value.slice(0,10),y=$("#ey").value.slice(0,10);$("#ex").value=x;$("#ey").value=y;runS(editSteps(x,y))};$("#ego").onclick=go;$("#eex").onclick=()=>{$("#ex").value="kitten";$("#ey").value="sitting";go()};go()},
  notes:tags({"Time and memory":"O(nm)"})+`<p><b>Definition.</b> An edit operation inserts, deletes or changes one character. The edit (Levenshtein) distance L(x, y) is the smallest number of edit operations turning x into y. L(abba, cba) = 2: change a → c and delete b, or delete a and change b → c.</p>
  <p><b>Recursion.</b> The operations of a shortest sequence can be ordered from left to right. If x₁ = y₁, then L(x, y) = L(x₂…xₙ, y₂…yₘ). Otherwise the first character is handled by one of three operations, and we take the best:</p>
  <ul><li>change x₁ to y₁: 1 + L(x₂…xₙ, y₂…yₘ);</li><li>delete x₁: 1 + L(x₂…xₙ, y₁…yₘ);</li><li>insert y₁ in front of x: 1 + L(x₁…xₙ, y₂…yₘ).</li></ul>
  <p>The subproblems are pairs of suffixes, given by their start indices i and j: EditRec(i, j), with EditRec(1, 1) = L(x, y). If x is used up, insert the m − j + 1 remaining characters of y; if y is used up, delete the n − i + 1 remaining characters of x.</p>
  <p><b>Memoization.</b> Store EditMem(i, j) in T[i, j]. There are (n + 1)(m + 1) cells, each computed once in O(1): <b>O(nm)</b> time and memory. The picture fills the table in the iterative order (the lecture’s exercise): from the last column and row backwards, since T[i, j] needs T[i + 1, j + 1], T[i + 1, j] and T[i, j + 1].</p>
  <p class="own">Recovering the operations (Tutorial 10, Ex. 8): start at T[1, 1] and repeatedly move to a neighbour cell whose value gave the minimum, recording the operation. My answer; shown at the end.</p>`},
 {id:"optbst",title:"Optimal BST",lec:"L11",sub:"Given how often each key is searched, build the BST with the smallest total search cost Σ depth(i)·pᵢ. Try every root; the subtrees are smaller instances of the same problem.",code:OBC.code,ids:OBC.ids,head:[0],draw:drawOBST,
  setup(inp){inp.innerHTML=`<label>Keys <input type="text" id="ok" value="8, 11, 16, 20, 25" style="width:170px"></label><label>Frequencies <input type="text" id="op" value="100, 250, 50, 400, 200" style="width:200px"></label><button class="b pri" id="ogo">Compute</button><button class="b" id="ornd">Random</button>`;
    const go=()=>{let k=parseArr($("#ok").value).slice(0,8),p=parseArr($("#op").value).slice(0,k.length);if(!k.length||p.length<k.length)return;const o=k.map((x,i)=>[x,p[i]]).sort((a,b)=>a[0]-b[0]);k=o.map(x=>x[0]);p=o.map(x=>Math.abs(x[1]));$("#ok").value=k.join(", ");$("#op").value=p.join(", ");runS(obstSteps(k,p))};
    $("#ogo").onclick=go;$("#ornd").onclick=()=>{const n=6;$("#ok").value=Array.from({length:n},(_,i)=>(i+1)*10).join(", ");$("#op").value=Array.from({length:n},()=>1+rndI(50)).join(", ");go()};go()},
  notes:tags({Recursive:"exponential",Memoized:"O(n³) time, O(n²) memory"})+`<p><b>Problem.</b> Keys 1, …, n with search frequencies p₁, …, pₙ. Find a BST minimizing Σ h_T(i)·pᵢ, where h_T(i) is the depth of i (the root has depth 1). Lecture example: keys 8, 11, 16, 20, 25 searched 100, 250, 50, 400 and 200 times.</p>
  <p><b>Idea.</b> Try every root r. It splits the keys into L = {1, …, r − 1} and R = {r + 1, …, n}; take the best trees T_L and T_R. Every key of L and R is one level deeper, so the cost is 1·p_r + Σ_L (1 + h_L(i))pᵢ + Σ_R (1 + h_R(i))pᵢ = Σ_all pᵢ + cost(T_L) + cost(T_R).</p>
  <p><b>Lemma.</b> BSTOPT_rec returns the cost of an optimal BST. <i>Proof:</i> it returns the cost of some BST, so it is an upper bound. Let T be optimal with root r, by induction on the size: the recursion tries r; T_L and T_R are smaller, so by the induction hypothesis the recursive calls return costs at most those of T_L and T_R; hence the returned value is at most cost(T).</p>
  <p><b>Lemma.</b> BSTOPT(1, n) runs in O(n³). <i>Proof:</i> the subproblems are intervals ℓ…u: O(n²) table cells. Each cell tries O(n) roots with two table look-ups each: O(n) per cell. In total O(n²)·O(n) = O(n³).</p>
  <p class="own">The table is filled by interval length (the iterative order); each cell also stores its best root, which gives the tree at the end. The lecture’s convex polygon triangulation is marked optional and excluded from this year’s exam, so it is not included.</p>`},
 {id:"jarnik",title:"Jarník’s (Prim’s) algorithm",lec:"L11",sub:"Grow one tree from a start vertex. In every step, add the lightest edge leaving the tree (the lightest edge of the current cut).",code:JRC.code,ids:JRC.ids,head:[0],draw:drawJarnik,
  setup(inp){param={G:WG.lec};inp.innerHTML=`<label>Graph <select id="jg"><option value="lec">lecture example</option><option value="rnd">random graph</option></select></label><label>Start vertex <select id="jv"></select></label><button class="b" id="jnew">New random graph</button>`;
    const fillV=()=>{$("#jv").innerHTML=Object.keys(param.G.V).map(v=>`<option>${v}</option>`).join("")};const go=()=>runS(jarnikSteps(param.G,$("#jv").value));
    $("#jg").onchange=e=>{param.G=e.target.value=="lec"?WG.lec:randWG();fillV();go()};$("#jnew").onclick=()=>{$("#jg").value="rnd";param.G=randWG();fillV();go()};$("#jv").onchange=go;fillV();go()},
  notes:tags({Naive:"O(nm)","With a binary heap":"O(m log n)"})+`<p><b>MST.</b> In a connected graph G = (V, E) with edge weights w, the weight of a subgraph is the sum of its edge weights. A minimum spanning tree is a spanning tree of the smallest weight.</p>
  <p><b>Greedy.</b> Jarník’s algorithm (1930; rediscovered by Prim in 1957) always takes the locally best edge, and for MST this is globally optimal.</p>
  <p><b>Lemma.</b> It stops after at most n iterations with a spanning tree. <i>Proof:</i> T grows by attaching leaves, so it is always a tree, and it gains a vertex each iteration. While V(T) ≠ V(G), G is connected, so some edge leaves V(T). So it stops only when V(T) = V(G).</p>
  <p><b>Elementary cut.</b> For A ⊆ V and B = V ∖ A, the set of edges with one end in A and the other in B.</p>
  <p><b>Cut lemma.</b> If the weights are distinct and e is the lightest edge of an elementary cut R, then e is in every MST. <i>Proof</i> (contrapositive): let T be a spanning tree without e = {a, b}. The a-b-path in T starts in A and ends in B, so it uses some edge f of the cut. Removing f splits T into two trees, one with a and one with b; adding e joins them into a spanning tree T′ with w(T′) = w(T) − w(f) + w(e) &lt; w(T), because w(e) &lt; w(f). So T is not an MST.</p>
  <p><b>Theorem.</b> With distinct weights, a connected graph has exactly one MST, and Jarník’s algorithm finds it. <i>Proof:</i> each chosen edge is the lightest in the cut between T and the rest, so by the cut lemma it is in every MST. All spanning trees have n − 1 edges, so the tree found equals every MST. <b>Corollary:</b> the MST depends only on the order of the weights. With repeated weights a stronger cut lemma (exchange e for f in some MST) shows that Jarník still finds one of the MSTs.</p>
  <p><b>With a binary heap.</b> Keep the vertices outside T in a heap keyed by d(v), the lightest edge from T to v (the table on the right). ExtractMin picks the next vertex; DecreaseKey updates its neighbours. n − 1 ExtractMins and at most m DecreaseKeys: O(m log n).</p>
  <p class="own">Prerequisite 11: for a disconnected graph, restart Jarník from a vertex not yet reached, to get a minimum spanning forest.</p>`},
 {id:"kruskal",title:"Kruskal’s algorithm and union-find",lec:"L11",sub:"Go through the edges from the lightest; keep an edge unless it closes a cycle. A union-find structure of “bushes” tells whether two vertices are already connected.",code:KRC.code,ids:KRC.ids,head:KRC.head,draw:drawKruskal,
  setup(inp){param={G:WG.lec};inp.innerHTML=`<label>Graph <select id="kg"><option value="lec">lecture example</option><option value="rnd">random graph</option></select></label><button class="b" id="knew">New random graph</button>`;
    const go=()=>runS(kruskalSteps(param.G));$("#kg").onchange=e=>{param.G=e.target.value=="lec"?WG.lec:randWG();go()};$("#knew").onclick=()=>{$("#kg").value="rnd";param.G=randWG();go()};go()},
  notes:tags({"Total":"O(m log n)","Find, Union (bushes)":"O(log n)"})+`<p><b>Lemma.</b> Kruskal’s algorithm returns a minimum spanning tree. <i>Proof.</i> T stays acyclic. If T were disconnected, take a component T_u: the elementary cut between T_u and the rest contains some edge e (G is connected), and when e was processed, T + e was acyclic, so e would have been added — a contradiction. So T is a spanning tree. For minimality take an MST T̂ sharing as many edges with T as possible, and suppose an edge e of T is not in T̂. In the cut R given by the two components of T − e, e is the lightest edge (a lighter one would have been added earlier) and the only one in T. By the cut lemma with repeated weights, exchanging e for an edge f ∈ R ∩ T̂ gives an MST sharing more edges with T — a contradiction.</p>
  <p><b>Union-find.</b> Find(u, v): are u and v in the same component? Union(u, v): merge their components. Kruskal makes m Finds and n − 1 Unions after sorting, so it takes O(m log n + m·T_f(n) + n·T_u(n)).</p>
  <ul><li><b>Array</b> of component numbers: Find O(1), Union O(n) (relabel a component): O(m log n + n²) in total.</li><li><b>Bushes:</b> each component is a tree with pointers to the parent P(v); the root identifies the component. Find walks up to the roots. Union hangs the shallower bush under the root of the deeper one; with equal depths, the depth grows by one.</li></ul>
  <p><b>Lemma.</b> A bush of depth d always has at least 2^{d−1} vertices. <i>Proof</i> by induction on the number of Unions: at the start every bush has depth 1 and 1 vertex. Hanging a shallower bush under a deeper one keeps the depth and adds vertices. Merging two bushes of equal depth d, each with at least 2^{d−1} vertices, gives depth d + 1 and at least 2^{d−1} + 2^{d−1} = 2ᵈ vertices. <b>Corollary:</b> depth ≤ 1 + log n, so Find and Union take O(log n) and Kruskal takes O(m log n).</p>
  <p class="own">The lecture’s code starts with D(v) = 0 while its text says a single vertex has depth 1; only comparisons of D matter, so both work. Prerequisite 11: weights from 1 to 5 can be sorted in O(m) with CountingSort, but the union-find part still costs O(m log n).</p>`},
 {id:"dijkstra",title:"Dijkstra’s algorithm",lec:"L12",sub:"Shortest paths from v₀ when all edge lengths are positive: always relax the open vertex with the smallest tentative distance h(v), like a BFS wave whose “alarm clocks” ring in time order.",code:DJC.code,ids:DJC.ids,head:[0],draw:drawDijkstra,setup(inp){spSetup(inp,true)},
  notes:tags({"Array":"O(n²)","Binary heap":"O((n + m) log n)","Needs":"ℓ ≥ 0"})+`<p><b>Weighted digraph.</b> Every edge e has a length ℓ(e); a walk’s length is the sum of its edge lengths. The distance d(u, v) is the minimum length of a uv-path (+∞ if none). Walk contraction, the triangle inequality and “parts of shortest paths are shortest paths” are blocks on the Graph theory page (Lecture 12).</p>
  <p><b>From BFS.</b> With integer lengths one could subdivide every edge into unit edges and run BFS, but that costs Θ(L·m + n) for maximum length L. Dijkstra instead sets an “alarm clock” h(w) = NOW + ℓ(v, w) at each successor and always jumps to the next alarm.</p>
  <p><b>Relaxation of v</b> = lines (8)–(13): try to improve h(w) through v for every successor w.</p>
  <p><b>Theorem.</b> With positive lengths Dijkstra terminates, and every reachable vertex v ends closed with h(v) = d(v₀, v). Proved through four properties:</p>
  <ol><li><b>h(v) never increases</b>, and if finite it is the length of the v₀v-walk read backwards from v, P(v), P(P(v)), …. <i>Induction on the steps:</i> h(w) changes only when relaxing an open v with finite h(v); extending the walk to v by (v, w) gives a walk of length h(v) + ℓ(v, w), and P(w) = v.</li>
  <li><b>All reachable vertices get opened, and a closed vertex is never re-opened.</b> A vertex is opened only from an opened predecessor, so it is reachable. Line (7) picks the smallest h among open vertices, and new values are h(v) + ℓ ≥ h(v), so open vertices always have h ≥ every closed one; a closed c can therefore not be improved: h(c) ≤ h(o) + ℓ(o, c).</li>
  <li><b>It terminates:</b> each iteration closes one vertex, for good: at most n iterations.</li>
  <li><b>Closed vertices have the right distance.</b> Suppose some vertex is “bad” (h(v) ≠ d(v₀, v), so h(v) &gt; d(v₀, v)); take a bad v with the smallest d(v₀, v), a shortest v₀v-path P and the vertex w before v on P. w is not bad, so h(w) = d(v₀, w), and P − v is a shortest v₀w-path. When w was relaxed, h(v) became ≤ d(v₀, w) + ℓ(w, v) = d(v₀, v), and h never increases — a contradiction.</li></ol>
  <p><b>Time.</b> With an array: at most n iterations, each finding a minimum of n values and scanning at most n successors: O(n²). With a binary heap keyed by h: n ExtractMins and at most m DecreaseKeys: O((n + m) log n).</p>
  <p><b>Negative edges.</b> Dijkstra may re-open closed vertices and in bad cases needs exponentially many steps. Load the Prerequisite 12 graph: v₁ is closed with h = 3 before the edge v₂ → v₁ of length −4 is seen, so v₁ is re-opened (!!). With no negative cycle, use Bellman-Ford instead.</p>
  <p class="own">The lecture’s example graph here is reconstructed from the slide’s final h and P values (a: 0, b: 5, c: 2, d: 3, e: 7); the exact layout of the slide may differ.</p>`},
 {id:"bellman",title:"Bellman-Ford and relaxation",lec:"L12",sub:"Shortest paths when edges may be negative but there is no negative cycle. Relax vertices in queue order (or all edges in rounds); a vertex may be relaxed several times.",code:BFC.simple.code,ids:BFC.simple.ids,head:[0],draw:drawBF,setup(inp){spSetup(inp,false)},
  notes:tags({"Bellman-Ford":"O(nm)","Needs":"no negative cycle"})+`<p><b>Negative cycles.</b> If a cycle has negative total length, walks around it get arbitrarily short, so shortest walks need not exist. Negative edges alone are fine: with no negative cycle, walk contraction still holds, so every uv-walk contains a uv-path that is not longer.</p>
  <p><b>Relaxation algorithms.</b> Like Dijkstra, but pick any open vertex; a vertex may be opened many times (open = its h changed and it must be relaxed again). Whatever the choice:</p>
  <ol><li>h(v) never increases, and a finite h(v) is the length of some v₀v-walk (induction, as for Dijkstra).</li><li>If it terminates, a vertex is closed exactly when it is reachable from v₀ (as for BFS, looking at the last closing).</li><li>If it terminates, finite h(v) equal d(v₀, v). <i>Proof:</i> take the first bad vertex v on a shortest v₀v-path P and its predecessor p on P; p is good, so h(p) = d(v₀, p), and p was relaxed and closed after h(p) got this value, making h(v) ≤ d(v₀, p) + ℓ(p, v) = d(v₀, v) — a contradiction since h never increases.</li></ol>
  <p><b>Bellman-Ford (Moore’s variant)</b> takes the open vertices in queue order. Phases: F₀ opens v₀; A_i is the set opened in F_i; phase F_{i+1} processes the |A_i| vertices of A_i.</p>
  <p><b>Lemma.</b> After phase F_i, every vertex v with finite h(v) has h(v) ≤ ℓ(W_i), where W_i is a shortest v₀v-walk with at most i edges. <i>Proof</i> by induction on i. If W_i has fewer than i edges, the bound held already. Otherwise let (u, v) be its last edge and W′ the rest: h(u) ≤ ℓ(W′) at the start of F_i; the current h(u) was set by phase F_{i−1} at the latest, which opened u, so u is relaxed in F_i, giving h(v) ≤ h(u) + ℓ(u, v) ≤ ℓ(W′) + ℓ(u, v) = ℓ(W_i).</p>
  <p><b>Corollary.</b> With no negative cycle, shortest paths have at most n − 1 edges, so nothing changes in phase F_n: the algorithm stops after at most n phases. <b>Theorem:</b> it returns shortest paths in O(nm), since each phase relaxes every vertex at most once, which is O(m).</p>
  <p><b>SimpleBellman-Ford.</b> n − 1 rounds, each relaxing every edge in a fixed order. After round i, every vertex reachable by a walk of at most i edges has h(v) at most the shortest such walk: correct, O(nm). The edge order matters only for how fast values settle — compare “as listed” and “reversed” on the Prerequisite 12 graph (Prerequisite 12, Ex. 3).</p>
  <p class="own">The extra negative-cycle check after n − 1 rounds, and stopping the queue version after n phases, are standard additions, not in the lecture. Tutorial 12, Ex. 4 (shortest paths in a DAG in O(n + m)): relax the vertices once each in topological order.</p>`}

let page=null,steps=[],at=0,timer=null,param={},heapH=[null,3,4,7,5,6,9,8,13,11];
function show(){const s=steps[at];if(!s)return;
  if(page.draw)page.draw(s);else if(page.kind=="array")drawArray(s);else if(page.kind=="graph")drawGraph(page.G,s,{...page.opt,pick:page.input=="vertex"?v=>{param.v=v;const sel=$("#vsel");if(sel)sel.value=v;restart()}:null});else drawHeap(s);
  $("#msg").textContent=s.msg;$("#cnt").textContent=`Step ${at+1} of ${steps.length}`;
  const CC=s.code||page.code,II=s.ids||page.ids,HH=s.head||page.head;
  const on=new Set(s.ln.map(x=>II?II.indexOf(x):page.line?page.line(x):x));
  $("#code").innerHTML=CC.map((l,i)=>`<div class="${HH.includes(i)?"h":""}${on.has(i)&&!HH.includes(i)?" on":""}">${esc(l)}</div>`).join("");
  $("#prev").disabled=$("#first").disabled=at==0;$("#next").disabled=at==steps.length-1;if(at==steps.length-1)stop()}
function stop(){clearInterval(timer);timer=null;$("#play").textContent="Play"}
function play(){if(timer){stop();return}if(at==steps.length-1)at=0;$("#play").textContent="Pause";show();timer=setInterval(()=>{if(at<steps.length-1){at++;show()}else stop()},1300/$("#speed").value*2)}
function restart(){stop();steps=page.make(param);at=0;show()}
function parseArr(t){const a=t.split(/[\s,;]+/).filter(x=>x!=="").map(Number).filter(x=>Number.isFinite(x)).map(x=>Math.round(x));return a.slice(0,16)}
function open(id){stop();page=PAGES.find(p=>p.id==id)||PAGES[0];try{history.replaceState(null,"","#"+page.id)}catch(e){}

  $("#title").textContent=page.title;$("#sub").textContent=page.sub+"  ·  "+page.lec.replace(/L/g,"Lecture ");$("#notes").innerHTML=page.notes;
  const inp=$("#inputs");inp.innerHTML="";$("#stepper").style.display=$("#msg").style.display=page.static?"none":"";$("#code").parentElement.parentElement.style.display=page.static?"none":"";
  if(page.input=="array"){param={a:page.def.slice()};inp.innerHTML=`<label>Input <input type="text" id="arr" value="${page.def.join(", ")}"></label><button class="b" id="apply">Run on this input</button><button class="b" id="rnd">Random</button><button class="b" id="srt">Sorted</button><button class="b" id="rev">Reversed</button>`;
    const set=a=>{if(a.length<2)return;param.a=a;$("#arr").value=a.join(", ");restart()};$("#apply").onclick=()=>set(parseArr($("#arr").value));$("#arr").onkeydown=e=>{if(e.key=="Enter")set(parseArr($("#arr").value))};
    $("#rnd").onclick=()=>set(Array.from({length:8},()=>1+Math.floor(Math.random()*30)));$("#srt").onclick=()=>set(param.a.slice().sort((x,y)=>x-y));$("#rev").onclick=()=>set(param.a.slice().sort((x,y)=>y-x));restart()}
  else if(page.input=="vertex"){param={v:page.def};inp.innerHTML=`<label>Start vertex <select id="vsel">${Object.keys(page.G.V).map(v=>`<option>${v}</option>`).join("")}</select></label>`;$("#vsel").value=page.def;$("#vsel").onchange=e=>{param.v=e.target.value;restart()};restart()}
  else if(page.input=="heapops"){inp.innerHTML=`<label>Key <input type="number" id="hk" value="2"></label><button class="b pri" id="hins">HeapInsert</button><button class="b pri" id="hext">HeapExtractMin</button><button class="b" id="hmin">HeapFindMin</button><button class="b" id="hreset">Reset heap</button>`;
    const run=S=>{stop();steps=S;at=0;const last=S[S.length-1];heapH=last.H.slice();show()};
    const idle=msg=>run([{ln:[],msg,H:heapH.slice(),n:heapH.length-1,cls:{},out:[]}]);
    $("#hins").onclick=()=>{const k=Math.round(+$("#hk").value);if(!Number.isFinite(k))return;if(heapH.length>31){idle("The picture holds at most 31 elements. Extract some first.");return}run(heapInsert(heapH,k));$("#hk").value=1+Math.floor(Math.random()*20)};
    $("#hext").onclick=()=>run(heapExtract(heapH));
    $("#hmin").onclick=()=>run([{ln:[],msg:heapH.length>1?`HeapFindMin returns the key of the root: ${heapH[1]}. Time O(1).`:"The heap is empty.",H:heapH.slice(),n:heapH.length-1,cls:{1:"min"},out:[]}]);
    $("#hreset").onclick=()=>{heapH=[null,3,4,7,5,6,9,8,13,11];idle("The heap from the lecture. Choose an operation, then step through it.")};idle("The heap from the lecture. Choose an operation, then step through it.")}
  else if(page.kind=="rep")repPage();else if(page.setup)page.setup(inp);else{param={};restart()}}

    <p class="own" style="margin:6px 0 0">n = ${V.length} lists, ${dir?"m = "+E.size:"2m = "+2*E.size} elements (m = ${E.size})</p></div></div>`;$("#viz").innerHTML=h;
    const svg=$("#rsvg");E.forEach(e=>{const [a,b]=e.split("-").map(Number),[x1,y1]=pos[a],[x2,y2]=pos[b],d=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/d,uy=(y2-y1)/d;
      mk("line",{x1:x1+ux*19,y1:y1+uy*19,x2:x2-ux*(dir?23:19),y2:y2-uy*(dir?23:19),class:"e",...(dir?{"marker-end":"url(#ah)"}:{})},svg)});

      g.addEventListener("click",()=>{if(sel===null)sel=v;else{if(sel!==v){const k=sel+"-"+v,r=v+"-"+sel;if(E.has(k))E.delete(k);else if(!dir&&E.has(r))E.delete(r);else E.add(k)}sel=null}draw()})});
